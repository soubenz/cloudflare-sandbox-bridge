name: Deploy

# GitHub's runners have Docker, which this session does not — that's the
# reason this workflow exists rather than deploying straight from here.
# Without it, wrangler refuses to build the AgentLab/GatewayLab container
# images and the two families never get a working warm pool.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'images/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'migrations/**'
      - 'dashboard/**'
      - 'scripts/**'
      - 'packages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Was 30. Two real runs (27 Sep 2026, run #68 attempts 1 and 2) hit this
    # exact ceiling on the Dry-run step alone, cancelled at 29m47s and
    # 29m50s -- not a hang (no loop or prompt anywhere in either Dockerfile),
    # just two full image rebuilds that have grown past a 30-minute budget
    # now that the gateway image duplicates the agent image's deadsnakes +
    # ContextForge install on top of its own pgvector/Qdrant/Phoenix/
    # Jaeger/otelcol-contrib additions. Raised with real headroom rather
    # than a minimal bump, since a third timeout would cost another
    # multi-attempt cycle to diagnose again.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # The container-change check below diffs github.event.before..sha,
          # which a depth-1 clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Unit tests
        run: npm test

      - name: Design tokens contrast check
        run: node scripts/contrast-check.mjs

      # Docker's build context is each family's own directory, so the
      # canonical images/common/opalix-init.sh is copied into both. See
      # images/common/README.md.
      - name: init.sh copies are identical
        run: |
          cmp images/common/opalix-init.sh images/agent/opalix-init.sh \
            && cmp images/common/opalix-init.sh images/gateway/opalix-init.sh \
            || { echo "opalix-init.sh copies differ; edit all three"; exit 1; }

      # Confirms the config compiles before spending time on a Docker build.
      - name: Dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --dry-run --env=""

      # The dry-run built both images locally. Fail before deploying if one has
      # outgrown 85% of its instance type's disk: the failure otherwise only
      # shows after deploy, as ImagePullError with the whole pool stuck in
      # `provisioning` (see the GatewayLab comment in wrangler.jsonc).
      - name: Image size gate
        run: node scripts/image-size-gate.mjs

      # Before the deploy, never after: a Worker that writes a column its
      # database does not have yet fails every session it tries to create.
      # `migrations apply` tracks what it has run, so re-running is a no-op.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply opalix --remote

      - name: Deploy (Worker, Durable Objects, and both container images)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The rollout wait below only trusts container apps modified after this.
          echo "ROLLOUT_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          npx wrangler deploy --containers-rollout=immediate --env=""

      # The dashboard is its own Worker (assets only, no server side). It
      # deploys after the API so a new UI never talks to an older API.
      - name: Build dashboard
        run: npm run build:dashboard

      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config dashboard/wrangler.jsonc

      # Decide whether this push changed the container images or their
      # config. Only then is there a rollout to wait for and a pool to drain.
      # workflow_dispatch always counts as changed; so does an unusable
      # `before` (first push, force push, unreachable commit).
      - name: Detect container changes
        id: containers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed=true
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; then
            if echo "$files" | grep -Eq '^(images/|wrangler\.jsonc$)'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Container images or wrangler.jsonc changed: $changed"

      # `--containers-rollout=immediate` returns before Cloudflare finishes
      # rolling out (docs/spike.md, "A deploy lesson"); draining inside that
      # window refills the pool on the previous image.
      - name: Wait for container rollout
        if: steps.containers.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # No such secret is defined yet; fall back to the id already in wrangler.jsonc's vars.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '8f5baf938da8f184c5431050d65eef08' }}
        run: bash scripts/wait-for-rollout.sh

      - name: Drain warm pools
        if: steps.containers.outputs.changed == 'true'
        env:
          OPALIX_URL: ${{ secrets.OPALIX_URL }}
          OPALIX_KEY: ${{ secrets.OPALIX_KEY }}
        run: bash scripts/drain-pools.sh

      # Last on purpose: the dashboard deploy above is trivially rolled back,
      # so a failing smoke test does not need to block it.
      - name: Smoke test
        env:
          OPALIX_URL: ${{ secrets.OPALIX_URL }}
          OPALIX_KEY: ${{ secrets.OPALIX_KEY }}
        run: |
          if [ -z "$OPALIX_URL" ] || [ -z "$OPALIX_KEY" ]; then
            echo "::notice::OPALIX_URL/OPALIX_KEY secrets not set; skipping smoke test."
            exit 0
          fi
          npx vitest run test/integration/smoke.test.ts --config vitest.integration.config.ts

      # The build output reports manifest bytes, not image size, so the
      # only way to answer "how big is the agent image" (a spike question,
      # and what drives cold-start time) is to ask Docker afterwards.
      # Size alone does not say what to cut. The per-layer breakdown does,
      # and it answers the question that decides the approach: how much of
      # the image is the base we cannot change.
      - name: Report image sizes and layers
        if: always()
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | head -20
          for img in $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep opalix-sandbox | head -2); do
            echo "=== $img ==="
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "$img" | head -25
          done
          echo "=== base image ==="
          docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -i sandbox | head -5
