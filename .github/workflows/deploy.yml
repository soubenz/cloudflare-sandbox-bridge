name: Deploy

# GitHub's runners have Docker, which this session does not — that's the
# reason this workflow exists rather than deploying straight from here.
# Without it, wrangler refuses to build the AgentLab/GatewayLab container
# images and the two families never get a working warm pool.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Unit tests
        run: npm test

      # Confirms the config compiles before spending time on a Docker build.
      - name: Dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --dry-run --env=""

      # Before the deploy, never after: a Worker that writes a column its
      # database does not have yet fails every session it tries to create.
      # `migrations apply` tracks what it has run, so re-running is a no-op.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply opalix --remote

      - name: Deploy (Worker, Durable Objects, and both container images)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --containers-rollout=immediate --env=""

      # The dashboard is its own Worker (assets only, no server side). It
      # deploys after the API so a new UI never talks to an older API.
      - name: Build dashboard
        run: npm run build:dashboard

      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config dashboard/wrangler.jsonc

      # The build output reports manifest bytes, not image size, so the
      # only way to answer "how big is the agent image" (a spike question,
      # and what drives cold-start time) is to ask Docker afterwards.
      # Size alone does not say what to cut. The per-layer breakdown does,
      # and it answers the question that decides the approach: how much of
      # the image is the base we cannot change.
      - name: Report image sizes and layers
        if: always()
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | head -20
          for img in $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep opalix-sandbox | head -2); do
            echo "=== $img ==="
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "$img" | head -25
          done
          echo "=== base image ==="
          docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -i sandbox | head -5
