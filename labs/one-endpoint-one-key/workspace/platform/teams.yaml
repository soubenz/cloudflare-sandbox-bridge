# The platform's own record of what should exist. You do not edit this file
# to "make the lab pass" -- setup.py reads it and is supposed to make the
# running gateway actually match it. If you change what a team is allowed to
# call, change it here and re-run setup.py.
teams:
  search:
    # search may only ever reach the shared "support" alias.
    models: [support]
  billing:
    # billing may reach both "support" and "fast".
    models: [support, fast]

# A user who is a member of exactly one team, and who is meant to be able to
# self-serve keys for that team only -- never for another team, and never
# any platform-admin action (listing every user, seeing every team, etc).
users:
  billing-admin:
    team: billing
