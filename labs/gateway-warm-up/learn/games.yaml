# Two short games, played after the closing. Each tests one thing the
# closing showed: who holds the keys, and the steps of one call.
games:
  - kind: sort
    id: whose-key
    title: Whose key is it?
    prompt: "Six situations. In each one, who holds the provider key: the app, or the gateway?"
    host: tomasz
    timer: 10
    explanation: "An app that calls a provider directly must hold that provider's key, so the key can leak from the app. Behind a gateway, only the gateway holds provider keys, and changing one is one change in one place."
    buckets:
      - { id: app, label: The app holds the key }
      - { id: gateway, label: The gateway holds the key }
    cards:
      - { id: direct-call, text: "The support app calls the provider directly", bucket: app, why: "Calling the provider directly means sending its key: the app holds it." }
      - { id: settings-file, text: "A provider key is pasted into the search app's settings file", bucket: app, why: "The key sits in the app's own file, so the app holds it." }
      - { id: screenshot, text: "A screenshot of the billing app's code shows a provider key", bucket: app, why: "The key is in the app's code: the app holds it, and now so does anyone with the screenshot." }
      - { id: alias-call, text: "The support app sends the alias support to the gateway, which calls the provider", bucket: gateway, why: "The app sends only an alias. The gateway adds the key when it calls the provider." }
      - { id: one-swap, text: "A leaked provider key is replaced in one place, and no app changes", bucket: gateway, why: "One place to change it is the gateway: no app ever had the key." }
      - { id: new-team, text: "A new team starts calling models without ever seeing a provider key", bucket: gateway, why: "The team calls the gateway, and only the gateway holds provider keys." }

  - kind: order-and-nest
    id: through-the-door
    title: Through the door
    prompt: "Tap what happens next, from the app's call to the usage log."
    host: graham
    explanation: "The app's call holds every other step. The gateway looks the alias up, adds the key only it holds, calls the provider, passes the answer back and writes down the tokens with the team's name."
    steps:
      - { id: app-sends, text: "The app sends a call with the alias support", parent: null, order: 0 }
      - { id: look-up, text: "The gateway looks support up in its table", parent: app-sends, order: 0 }
      - { id: add-key, text: "The gateway adds the provider key", parent: app-sends, order: 1 }
      - { id: call-provider, text: "The gateway sends the call to the provider", parent: app-sends, order: 2 }
      - { id: answer-back, text: "The answer comes back to the app", parent: app-sends, order: 3 }
      - { id: write-usage, text: "The gateway writes the usage to its log, with the team's name", parent: app-sends, order: 4 }
