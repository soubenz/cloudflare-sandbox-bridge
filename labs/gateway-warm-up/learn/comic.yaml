title: Six things went wrong
panels:
  - scene: black
    captions:
      - { text: "Larkfield. One month. Six problems.", cue: "six things went wrong" }
      - { text: "Have you seen these at work?", cue: "probably seen" }
    voiceover: This is Larkfield, a company whose apps all use AI models. Last month, six things went wrong there. If your team builds with AI, you have probably seen some of them already.
  - scene: clip
    clip: phone-alert-night
    cast: [tomasz]
    shot: close
    caption: { text: "Saturday, 03:12", cue: "three twelve" }
    sfx: { text: "BZZT!", cue: "lights up", sound: phone }
    voiceover: It starts on a Saturday. At three twelve in the morning, the phone of Tomasz, an engineer on Larkfield's platform team, lights up the dark bedroom. The support assistant has stopped answering customers.
    bubbles:
      - { who: tomasz, text: "Two hundred customers waiting. I'm getting up.", cue: "stopped answering customers" }
    lines:
      - { text: "support assistant: not answering", cue: "stopped answering" }
      - { text: "customers waiting: 214", cue: "answering customers" }
  - scene: desk
    cast: [{ who: tomasz, mood: worried, pose: typing }]
    bg: night
    caption: { text: "03:40", cue: "three forty" }
    sfx: { text: "TICK", cue: "three forty", sound: tick }
    voiceover: He finds the cause fast. OpenAI, the company that runs the assistant's model, is down. Anthropic is up, but OpenAI's name is written into the app's code. So at three forty, Tomasz is still rewriting it by hand.
    bubbles:
      - { who: tomasz, text: "I've done good work at three a.m. This isn't it.", cue: "by hand" }
    lines:
      - { text: "provider: openai", cue: "written into the app" }
      - { text: "provider: anthropic   (edit this)", cue: "rewriting it" }
  - scene: diagram
    diagram: gateway-no-door
    steps:
      - { cue: "talks to its own provider" }
      - { cue: "A key is" }
    voiceover: That night did not come out of nowhere. Every app at Larkfield talks to its own provider, OpenAI, Anthropic or Google, and holds its own key. A key is the secret that proves who is paying.
  - scene: clip
    clip: maren-worried-laptop
    cast: [ollie, maren]
    shot: close
    caption: { text: "Tuesday, 10:05", cue: "Tuesday" }
    sfx: { text: "PING!", cue: "screenshot", sound: ping }
    voiceover: On Tuesday, Ollie, a developer, is proud of an answer from the assistant and shares a screenshot in the team chat. In the corner of the picture sits the team's OpenAI key.
    bubbles:
      - { who: maren, text: "Ollie. Bottom corner. That's our OpenAI key.", cue: "OpenAI key" }
      - { who: ollie, text: "Deleting it now. Eleven people have already seen it, though.", cue: "OpenAI key" }
    lines:
      - { text: "team chat: 11 likes", cue: "shares a screenshot" }
      - { text: "in the corner: sk-proj-4f9a...7d3e", cue: "In the corner" }
  - scene: desk
    cast: [{ who: ollie, pose: typing }]
    bg: sand
    voiceover: Then, on Friday evening, Ollie's research script hits an error and simply tries again. It keeps trying all weekend. By Monday morning it has spent the whole month's budget.
    lines:
      - { text: "$ retry", cue: "hits an error" }
      - { text: "error: try again", cue: "tries again" }
      - { text: "$ retry", cue: "keeps trying" }
      - { text: "error: try again", cue: "all weekend" }
      - { text: "budget left: 0", cue: "whole month's budget" }
    bubbles:
      - { who: ollie, text: "In my defence, the error did say try again.", cue: "whole month's budget" }
  - scene: duo
    cast: [tomasz, maren]
    bg: lilac
    voiceover: That Sunday, while the team is still cleaning up, Google renames one of its models. Three apps have the old name typed into their code, and all three stop working at once.
    bubbles:
      - { who: tomasz, text: "They renamed it. On a Sunday.", cue: "stop working" }
  - scene: duo
    cast: [graham, { who: maren, mood: worried }]
    bg: mint
    voiceover: At the end of the month, one invoice arrives with one number on it. Graham, the head of engineering, has a simple question for the team, and nobody can answer it.
    bubbles:
      - { who: graham, text: "Which team spent this? And with whom?", cue: "simple question" }
  - scene: duo
    cast: [jess, { who: tomasz, mood: tired }]
    bg: sand
    voiceover: The month ends on a missed chance. A new model comes out, faster and cheaper. Jess, the product manager, wants to try it today, but trying it means changing every app by hand.
    bubbles:
      - { who: jess, text: "It's faster AND cheaper! Can we try it today?", cue: "wants to try it" }
      - { who: tomasz, text: "Sure. In every app. By hand.", cue: "every app by hand" }
  - scene: black
    title: Normal, or a sign that something is missing?
    captions:
      - "OpenAI goes down, and the fix is rewriting app code at 3 a.m."
      - "An OpenAI key leaks in a screenshot in the team chat."
      - "A script retries all weekend and spends the month's budget."
      - "Google renames a model, and three apps break at once."
      - "One invoice, and nobody can say which team spent what."
      - "A faster, cheaper model nobody can try without changing every app."
    voiceover: One month, six problems. Read each one on the screen, and ask yourself whether it is normal, or a sign that something is missing.
