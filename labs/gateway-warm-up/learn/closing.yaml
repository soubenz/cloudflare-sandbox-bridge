title: One door
panels:
  - scene: clip
    clip: asleep-night
    cast: [tomasz]
    caption: { text: "03:12", cue: "three twelve" }
    voiceover: Saturday, three in the morning. At three twelve the same provider goes down again, and the phone stays dark.
    lines:
      - { text: "03:12  provider A: down", cue: "three twelve" }
      - { text: "support assistant: answering", cue: "stays dark" }
  - scene: diagram
    diagram: gateway-what-it-does
    cast: [ollie]
    steps:
      - { cue: "one door" }
      - { cue: "checks who is asking" }
      - { cue: "holds the provider keys" }
    voiceover: Larkfield's apps no longer call providers directly. They call one door, a gateway. It checks who is asking, and it holds the provider keys, so the apps never do.
    bubbles:
      - { who: ollie, text: "So I can't paste a key I never had. Got it.", cue: "apps never do" }
  - scene: diagram
    diagram: gateway-alias-routing
    steps:
      - { cue: "the name support" }
      - { cue: "looks it up" }
    voiceover: Follow one call. The support app sends a question with the name support. That name is an alias, Larkfield's own name for a job. The gateway looks it up in its table.
  - scene: screen
    voiceover: The table says provider A first, then provider B. Provider A is down, so the gateway sends the call to provider B, with the provider key that only the gateway holds.
    lines:
      - { text: "support: provider A, then B", cue: "provider A first" }
      - { text: "provider A: no answer", cue: "is down" }
      - { text: "provider B: answered", cue: "sends the call to provider B" }
  - scene: screen
    caption: { text: "The log", cue: "log" }
    voiceover: "Provider B answers. The gateway passes the answer back and writes one line in its log: the team, the alias and the tokens used, one thousand eight hundred and fifty. A token is a small piece of text that providers bill by."
    lines:
      - { text: "answer back to the support app", cue: "passes the answer back" }
      - { text: "log: support, alias support, B, 1,850", cue: "writes one line" }
      - { text: "token = a piece of text, billed by count", cue: "A token is" }
  - scene: desk
    cast: [{ who: graham, mood: pleased }]
    bg: mint
    sfx: { text: "CHA-CHING", cue: "adds the rows up", sound: register }
    voiceover: At the end of the month, Finance reads the log and adds the rows up by team. The one number on the invoice now has a name beside every part of it.
    lines:
      - { text: "team        tokens      cost", cue: "Finance reads" }
      - { text: "support     412,000     $3.10", cue: "adds the rows up" }
      - { text: "search      208,500     $1.40", cue: "by team" }
      - { text: "research     91,000     $0.60", cue: "every part" }
    bubbles:
      - { who: graham, text: "Every line has a name. I could get used to this.", cue: "every part" }
  - scene: diagram
    diagram: gateway-alias-routing
    cast: [jess]
    steps:
      - { cue: "asks for support" }
      - { cue: "one line of the table" }
    voiceover: One thing is now easy. Every app asks for support, never for a model. When a better model comes out, the platform team changes one line of the table, and no app changes.
    bubbles:
      - { who: jess, text: "So I can try the new model today? Today today?", cue: "no app changes" }
  - scene: you
    bg: cobalt
    caption: Your turn.
    voiceover: Next come four short games on what you have just seen. Then the first lab, where you send calls to a real gateway and watch what it does with them.
    lines:
      - "$ send_calls.py support \"hello gateway\""
      - "answered by: ?"
      - "total tokens: ?"
