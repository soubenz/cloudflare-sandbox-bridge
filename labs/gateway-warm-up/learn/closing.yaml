title: One door
panels:
  - scene: clip
    clip: asleep-night
    cast: [tomasz]
    caption: { text: "03:12", cue: "three in the morning" }
    voiceover: "Three months later, on another Saturday at three in the morning, OpenAI went down again, but this time Tomasz's phone stayed dark and he slept right through it."
    lines:
      - { text: "03:12  OpenAI: down", cue: "OpenAI went down" }
      - { text: "support assistant: answering", cue: "stayed dark" }
  - scene: diagram
    diagram: gateway-what-it-does
    cast: [ollie]
    steps:
      - { cue: "one door" }
      - { cue: "checks who is asking" }
      - { cue: "holds the keys" }
    voiceover: "What had changed was that Larkfield's apps no longer called providers directly; they all called one door, a gateway, which checks who is asking and holds the keys for every provider, so the apps never have to."
    bubbles:
      - { who: ollie, text: "So I can't paste a key I never had. Got it.", cue: "never have to" }
  - scene: diagram
    diagram: gateway-one-night
    steps:
      - { cue: "asks for support" }
      - { cue: "looks it up" }
    voiceover: "Follow the support assistant's call through that night: it asks for support rather than for a model, because support is an alias, Larkfield's own name for a job, and the gateway looks it up in its table."
  - scene: diagram
    diagram: gateway-one-night
    from: 3
    steps:
      - { cue: "fails to answer" }
      - { cue: "on to Anthropic" }
      - { cue: "still gets a reply" }
    voiceover: "The table lists OpenAI first and Anthropic second, so when OpenAI fails to answer, the gateway quietly sends the same call on to Anthropic, using a key only the gateway holds, and the customer still gets a reply."
  - scene: diagram
    diagram: gateway-one-night
    from: 6
    steps:
      - { cue: "one line in its log" }
    voiceover: "As Anthropic's answer goes back, the gateway writes one line in its log with the team, the alias and the tokens used, one thousand eight hundred and fifty of them, a token being a small piece of text that providers bill by."
  - scene: desk
    cast: [{ who: graham, mood: pleased }]
    bg: mint
    sfx: { text: "CHA-CHING", cue: "opens that log", sound: register }
    voiceover: "At the end of the month Graham opens that log, and because every row carries a team's name, the single number on the invoice finally breaks down, team by team."
    lines:
      - { text: "team        tokens      cost", cue: "opens that log" }
      - { text: "support     412,000     $3.10", cue: "team's name" }
      - { text: "search      208,500     $1.40", cue: "breaks down" }
      - { text: "research     91,000     $0.60", cue: "team by team" }
    bubbles:
      - { who: graham, text: "Every line has a name. I could get used to this.", cue: "team by team" }
  - scene: diagram
    diagram: gateway-alias-routing
    cast: [jess]
    steps:
      - { cue: "next new model" }
      - { cue: "one line in that table" }
    voiceover: "And when the next new model comes out, the platform team changes one line in that table, so every app that asks for support moves to the new model without a single change of its own."
    bubbles:
      - { who: jess, text: "So I can try the new model today? Today today?", cue: "change of its own" }
  - scene: you
    bg: cobalt
    caption: Your turn.
    voiceover: "Next come four short games about what you have just seen, and after them the first lab, where you send calls to a real gateway and watch what it does with them."
    lines:
      - "$ send_calls.py support \"hello gateway\""
      - "answered by: ?"
      - "total tokens: ?"
