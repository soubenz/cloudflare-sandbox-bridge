# Path 3, Module 2, lab 1 in docs/catalogue-path-2-ai-platform.md
# (explore, agent family).
#
# type: explore -- nothing is broken and nothing is missing (see
# docs/lab-authoring.md, "type: explore is a guided tour, not a puzzle").
#
# Real project: IBM's mcp-context-forge, PyPI package
# mcp-contextforge-gateway==1.0.10 (see $SCRATCH/contextforge-inv/FINDINGS.md).
# It needs Python 3.12, not the image's default 3.10 -- adding a python3.12
# interpreter to the agent image is a platform change the main session
# makes later (same order as Module 1's Postgres template and MLflow); this
# manifest already assumes it is there. The two toy MCP tool servers below
# only need the `mcp` PyPI package (requires-python >=3.10, confirmed via
# `pip show mcp`), so they run under the image's existing default `python3`.
#
# No Postgres, no Redis: SQLite is enough (FINDINGS.md). The two secrets
# ContextForge refuses to boot without, JWT_SECRET_KEY and
# AUTH_ENCRYPTION_SECRET, were generated once, locally, offline, via its own
# `python -m mcpgateway.scripts.init_secrets` (no network involved) and are
# given below as fixed values -- the learner never regenerates them.
#
# ContextForge's own admin UI is a `ui: true` tab here (service `admin`), with
# no login form, by trusted-proxy authentication. Confirmed live with a real
# browser (Playwright + chromium) through a /sessions/<id>/services/admin/
# path, no cookies:
#
#  - Without it, ALLOW_UNAUTHENTICATED_ADMIN=true grants admin only to a
#    request that doesn't look like a browser; a real tab hitting /admin is
#    redirected to a "Sign In" form (mcpgateway/middleware/rbac.py's
#    get_current_user checks for a token before it reaches that bypass). That
#    is why earlier versions of this lab kept ContextForge `ui: false` and
#    shipped only the `view` page. This lab no longer sets that flag.
#  - ContextForge 1.0.10 can instead take the admin identity from a request
#    header: MCP_CLIENT_AUTH_ENABLED=false, TRUST_PROXY_AUTH=true and
#    TRUST_PROXY_AUTH_DANGEROUSLY=true make a request carrying
#    X-Authenticated-User: <PLATFORM_ADMIN_EMAIL> an admin request, browser
#    or not (is_proxy_auth_trust_active in utils/verify_credentials.py). The
#    session proxy cannot add a header, so workspace/admin_proxy.py (the
#    `admin` service below) is a tiny stdlib reverse proxy that sets it on
#    every request, after discarding whatever the client sent. The scripts
#    that talk to ContextForge directly (seed_contextforge.py, call_tool.py,
#    view_service.py, checks/_harness.py) send the same header: with trusted
#    proxy mode on, a request with no header is anonymous and gets 403.
#  - Admin pages are gated by a role, not just by is_admin: the routes use
#    require_permission(..., allow_admin_bypass=False), and the
#    platform_admin role is only assigned to the admin user at boot when
#    EMAIL_AUTH_ENABLED=true. So email auth is on after all, with two fixed
#    lab-only passwords (the default "changeme" fails its own strength check).
#    Nobody ever types them: there is no login page in reach (the proxy turns
#    /admin/login and the Logout button into a redirect to the dashboard).
#  - MCPGATEWAY_UI_ENABLED (default false) and MCPGATEWAY_ADMIN_API_ENABLED
#    (default false) must be true, or /admin is a 404.
#  - APP_ROOT_PATH is set to the admin tab's own prefix. The session proxy
#    forwards the full path unchanged, and with APP_ROOT_PATH ContextForge
#    both accepts it and writes the prefix into every asset URL, htmx URL,
#    window.ROOT_PATH fetch() call and redirect itself, so the proxy rewrites
#    nothing in a page body. It also still answers unprefixed paths, so the
#    scripts above, and the healthcheck, are unaffected. The UI loads
#    nothing from a CDN (every script, stylesheet and font is under /static).
#    One stylesheet its template links, auth-animations.css, is missing from
#    the 1.0.10 wheel; the proxy answers it with an empty one.
#  - Registering a gateway at a 127.0.0.1 URL is blocked by ContextForge's
#    own SSRF protection by default ("Gateway URL contains localhost
#    address which is blocked by SSRF protection"); needs
#    SSRF_ALLOW_LOCALHOST=true, unsurprising for a lab where every service
#    is loopback-only.
slug: see-how-tools-reach-an-agent
version: 1.0.0
title: "See how tools reach an agent"
type: explore
family: agent
path: ai-platform
module: 2
order: 1
tier: pro
estimated_minutes: 20
summary: >-
  ContextForge fronting two toy MCP tool servers. A guided tour of how a
  tool call actually gets from a tool server to an agent through a
  gateway: register it, expose it through a virtual server, call it, and
  watch the gateway's own log record it.
objectives:
  - "Register an MCP tool server as a gateway in ContextForge"
  - "Expose a chosen set of tools through one virtual server"
  - "Call a tool through the gateway and see the request and response"
  - "Find where a gateway records that a call happened"
difficulty: intro
timeout_minutes: 60
idle_minutes: 10

env:
  CONTEXTFORGE_URL: "http://127.0.0.1:4744"
  WEATHER_TOOL_URL: "http://127.0.0.1:7745/mcp"
  CALC_TOOL_URL: "http://127.0.0.1:7746/mcp"
  CONTEXTFORGE_VIRTUAL_SERVER: "toy-tools"

services:
  - name: weather-tools
    # A toy MCP tool server (real `mcp` PyPI SDK, streamable-http
    # transport) -- get_weather and get_forecast, both made-up. No real
    # weather API and no route out of the container to one.
    argv: ["python3", "-B", "/workspace/tools/weather_tool_server.py"]
    cwd: /workspace
    env:
      WEATHER_TOOL_HOST: "127.0.0.1"
      WEATHER_TOOL_PORT: "7745"
    port: 7745
    # No separate /health route on an MCP tool server -- reachability is
    # the MCP initialize+tools/list handshake itself (FINDINGS.md), so a
    # plain TCP check is what "up" means here.
    healthcheck:
      type: tcp
      timeout_s: 30
    ui: false
    depends_on: []
  - name: calculator-tools
    # A second toy MCP tool server -- add, subtract, multiply.
    argv: ["python3", "-B", "/workspace/tools/calculator_tool_server.py"]
    cwd: /workspace
    env:
      CALC_TOOL_HOST: "127.0.0.1"
      CALC_TOOL_PORT: "7746"
    port: 7746
    healthcheck:
      type: tcp
      timeout_s: 30
    ui: false
    depends_on: []
  - name: contextforge
    # ui: false, on purpose: this port is the raw gateway, which trusts the
    # X-Authenticated-User header from whoever sends it. The learner reaches
    # its admin pages only through the `admin` service below, which sets that
    # header itself.
    #
    # seed_contextforge.py runs once in the background alongside the
    # gateway's own boot (same pattern as hard-budget-per-team's
    # seed_teams.py): it polls /health itself, so nothing here has to wait
    # for the gateway before starting it, and is idempotent, so a restart
    # of this same service (which re-runs this whole argv) finds both
    # gateways and the virtual server already in place and changes
    # nothing.
    argv:
      [
        "sh", "-c",
        "python3 -B /workspace/seed_contextforge.py & exec python3.12 -m mcpgateway",
      ]
    cwd: /workspace
    env:
      HOST: "0.0.0.0"
      PORT: "4744"
      # No login, ever (docs/lab-authoring.md's no-login rule). Trusted-proxy
      # authentication: the admin identity comes from the X-Authenticated-User
      # header (PROXY_USER_HEADER's default), and only the value
      # PLATFORM_ADMIN_EMAIL makes an admin. See the note above.
      MCP_CLIENT_AUTH_ENABLED: "false"
      TRUST_PROXY_AUTH: "true"
      TRUST_PROXY_AUTH_DANGEROUSLY: "true"
      PLATFORM_ADMIN_EMAIL: "admin@example.com"
      # false, not true: a request with no header is then anonymous (403)
      # instead of being sent to a /admin/login form.
      AUTH_REQUIRED: "false"
      # The admin pages, and the admin API routes they call.
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # Needed so the platform_admin role is assigned to PLATFORM_ADMIN_EMAIL
      # at boot (the admin routes check that role). The two passwords below
      # only have to pass ContextForge's strength check; no login page is
      # reachable, so nobody types them. Fixed lab-only values, generated
      # once, offline.
      EMAIL_AUTH_ENABLED: "true"
      PLATFORM_ADMIN_PASSWORD: "qhE_2vMVb6bbQIWNTH97Cj_e"
      DEFAULT_USER_PASSWORD: "vdQqOgfJYFybmanJjwDvmBTc"
      # The admin tab's own prefix: the session proxy forwards the full path
      # (/sessions/<id>/services/admin/...) unchanged, and with this set
      # ContextForge accepts that path and puts the prefix into every URL it
      # writes. Must match the `admin` service's name below.
      APP_ROOT_PATH: "/sessions/{{session.id}}/services/admin"
      # Every service here is loopback-only; without this, registering
      # either toy tool server as a gateway is refused by ContextForge's
      # own SSRF protection.
      SSRF_ALLOW_LOCALHOST: "true"
      # Off so dense grader polling (this lab's own checks, plus a learner
      # re-running call_tool.py) can never trip ContextForge's real rate
      # limiter and its 15-minute account lockout.
      RATE_LIMITING_ENABLED: "false"
      # Generated once, locally, offline, via ContextForge's own
      # `python -m mcpgateway.scripts.init_secrets` -- fixed lab values,
      # never regenerated by the learner.
      JWT_SECRET_KEY: "A9NdC6L_0Ewg3WT0vZuj-JEStFhflsDFELOTK6deBO8"
      AUTH_ENCRYPTION_SECRET: "hcakHJdD7TEiesCMThCGZaRAQgKcSiVDXkm8D7kLcoo"
      DATABASE_URL: "sqlite:////workspace/contextforge.db"
      CACHE_TYPE: "database"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      WEATHER_TOOL_URL: "http://127.0.0.1:7745/mcp"
      CALC_TOOL_URL: "http://127.0.0.1:7746/mcp"
    port: 4744
    healthcheck:
      type: http
      path: /health
      # Live boot (migrations included, fresh SQLite) is ~12-16s; 90s
      # leaves room for a slow container without hiding a real failure.
      timeout_s: 90
    ui: false
    depends_on: [weather-tools, calculator-tools]
  - name: admin
    label: ContextForge
    about: ContextForge's own admin pages, already signed in. Look at its gateways, tools and virtual servers here.
    # A tiny stdlib reverse proxy (workspace/admin_proxy.py) in front of
    # ContextForge on 127.0.0.1:4744. It sets X-Authenticated-User to
    # PLATFORM_ADMIN_EMAIL on every request (replacing any value the client
    # sent), which is what ContextForge's trusted-proxy mode takes as the
    # admin -- so the real admin pages open with no login form. See the note
    # at the top. ADMIN_PREFIX must equal this service's own prefix and the
    # contextforge service's APP_ROOT_PATH.
    argv: ["python3", "-B", "/workspace/admin_proxy.py"]
    cwd: /workspace
    env:
      ADMIN_PORT: "8964"
      ADMIN_PREFIX: "{{service.prefix}}"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      ADMIN_USER: "admin@example.com"
    port: 8964
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 30
    ui: true
    depends_on: [contextforge]
  - name: view
    label: Live view
    about: A read-only page that updates as you work. It shows what your lab is doing right now.
    # A small read-only stdlib page, workspace/view_service.py, next to the
    # admin tab: a compact version of the same facts. Shows the
    # registered gateways and discovered tools (from ContextForge's own
    # REST API, called the same way call_tool.py calls it) and the virtual server, plus ContextForge's own execution
    # log for every call made so far (read directly from its tool_metrics
    # table -- the gateway's own aggregate /v1/metrics is cached for up to
    # 60s, but the underlying table is written within a second or two of
    # each call, so this is the more immediate proof).
    argv: ["python3", "-B", "/workspace/view_service.py"]
    cwd: /workspace
    env:
      VIEW_PORT: "7747"
      VIEW_PREFIX: "{{service.prefix}}"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      CONTEXTFORGE_DB_PATH: "/workspace/contextforge.db"
    port: 7747
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 30
    ui: true
    depends_on: [contextforge, weather-tools, calculator-tools]

pressure: []

checks:
  - name: gateway-is-up
    script: gateway-is-up.sh
    timeout_s: 60
    weight: 1
  # The graded check: derives the true answer to each of the brief's three
  # questions from the live gateway itself (never a hard-coded value) and
  # compares them against /workspace/answers.json.
  - name: answers-match-the-gateway
    script: answers-match-the-gateway.sh
    timeout_s: 60
    weight: 2

hints:
  - after_minutes: 10
    text: >-
      Run `python3 -B call_tool.py --list` from a terminal to see every
      tool reachable through the virtual server (that list's length is the
      first answer), then
      `python3 -B call_tool.py calculator-tools-add '{"a": 17, "b": 25}'`
      for the second. For the third, call a name that was never
      registered anywhere, e.g.
      `python3 -B call_tool.py does-not-exist '{}'` -- look at the
      JSON-RPC result printed above the error, not just the HTTP status.
      Open the view tab afterwards -- the bottom table is ContextForge's
      own record of each call.

egress:
  allow: []
