              page: hook
              cols: 2
              gate: true
              visible: true
              scale: 0.85
              pos: [640, 440]
              items:
                - { text: Support, color: agent, font: hand }
                - { text: "■■■■■", color: agent }
                - { text: Billing, color: agent, font: hand }
