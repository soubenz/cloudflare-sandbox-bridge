  # Video 4. When a tool fails
  - id: mcp-when-a-tool-fails
    title: When a tool fails
    endCard: { title: "When a tool fails", sub: "Hands-on lab · See how tools reach an agent" }
    segments:
      # 1. Hook: the line (the code card is an illustration of a common pattern)
      - id: hook
        vo: >-
          This line is why your AI agent makes things up when a tool fails. It
          looks correct, and you have probably written it yourself.
        scene:
          id: fails
          pages: [{ id: hook }, { id: status }, { id: again }, { id: trace }, { id: reply }, { id: wrong }, { id: protocol }, { id: which }, { id: lab }, { id: careful }, { id: recap }, { id: cta }]
