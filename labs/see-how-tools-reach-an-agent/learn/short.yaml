            pk7a: { type: packet, on: a7, label: "tools/list", color: agent, lift: 40 }
            pk7b: { type: packet, on: a7, reverse: true, label: "tools/list reply: every tool", color: gateway, scale: 0.7, lift: -40, dur: 1.6 }
            # page: addr (illustrative address)
            badges: { type: list, page: addr, scale: 0.85, items: [{ text: "own", icon: key, color: yellow }, { text: "own", icon: key, color: yellow }, { text: "own", icon: key, color: yellow }], pos: [70, 350] }
            al8: { type: list, page: addr, font: hand, scale: 0.85, items: [{ text: Support, color: agent }, { text: Billing, color: agent }, { text: Ops, color: agent }], pos: [230, 350], visible: true }
            gw8: { type: node, page: addr, icon: gateway, label: "MCP gateway", color: gateway, scale: 0.85, pos: [530, 350], visible: true }
            sl8: { type: list, page: addr, font: hand, scale: 0.8, items: [{ text: Weather, color: weather }, { text: Calculator, color: calc }, { text: Orders, color: orders }, { text: Docs, color: docs }, { text: Maps, color: maps }], pos: [880, 350], visible: true }
            m8a: { type: mesh, page: addr, from: al8, to: gw8, color: agent, width: 2, opacity: 0.7, visible: true }
            m8b: { type: mesh, page: addr, from: gw8, to: sl8, color: gateway, width: 2, opacity: 0.7, visible: true }
            sec8: { type: chip, page: addr, icon: key, text: "server secrets", color: quiet, scale: 0.85, pos: [230, 540], visible: true }
            cnt8: { type: text, page: addr, text: "8 connections", size: 42, color: user, pos: [530, 640] }
            # page: watch (an illustration: the lab's log has no caller column)
            log:
              type: card
              page: watch
              title: "gateway log (illustration)"
              color: ok
              scale: 1.3
              pos: [500, 330]
              lines: ["18:41 · Ops · orders-get-order · ok · 2400 ms"]
              highlight:
                - { id: tool, match: "orders-get-order", color: orders }
                - { id: time, match: "18:41", color: user }
                - { id: dur, match: "2400 ms", color: calc }
                - { id: worked, match: "(?<= )ok(?= )", color: ok }
                - { id: who, match: "Ops", color: agent }
            # page: not
            gw10: { type: node, page: not, icon: gateway, label: "MCP gateway", color: gateway, scale: 0.85, pos: [500, 120], visible: true }
            runs: { type: chip, page: not, text: "runs the tools", color: quiet, pos: [500, 290], visible: true }
            picks: { type: chip, page: not, text: "chooses the tools", color: quiet, pos: [500, 400], visible: true }
            aigw: { type: chip, page: not, icon: model, text: "AI gateway → language models", color: model, pos: [500, 570] }
            # page: lab
            gw11: { type: node, page: lab, icon: gateway, label: "MCP gateway", color: gateway, pos: [500, 340], visible: true }
            tlist:
              type: terminal
              command: python3 -B call_tool.py --list
              show: "0,5-10"
              clip: 50
              highlight:
                - { id: url, match: "/servers/[0-9a-f]+/mcp", lines: "^-->", color: gateway }
                - { id: weather, match: "weather-tools-[a-z-]+", lines: "^  - ", color: weather }
                - { id: calc, match: "calculator-tools-[a-z]+", lines: "^  - ", color: calc }
              output: |
                --> POST http://127.0.0.1:4744/servers/66fb78f21dc64587af61e4c36fe54b1f/mcp
                    {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}
                <-- HTTP 200
                    {"jsonrpc": "2.0", "id": 1, "result": {"tools": [{"name": "calculator-tools-subtract", "description": "Subtract b from a and return the difference.", "inputSchema": {"properties": {"a": {"title": "A", "type": "number"}, "b": {"title": "B", "type": "number"}}, "required": ["a", "b"], "title": "subtractArguments", "type": "object"}, "outputSchema": {"properties": {"result": {"title": "Result", "type": "number"}}, "required": ["result"], "title": "subtractOutput", "type": "object"}, "annotations": {}}, {"name": "calculator-tools-multiply", "description": "Multiply two numbers and return the product.", "inputSchema": {"properties": {"a": {"title": "A", "type": "number"}, "b": {"title": "B", "type": "number"}}, "required": ["a", "b"], "title": "multiplyArguments", "type": "object"}, "outputSchema": {"properties": {"result": {"title": "Result", "type": "number"}}, "required": ["result"], "title": "multiplyOutput", "type": "object"}, "annotations": {}}, {"name": "weather-tools-get-weather", "description": "Get the current made-up weather for a city.", "inputSchema": {"properties": {"city": {"title": "City", "type": "string"}}, "required": ["city"], "title": "get_weatherArguments", "type": "object"}, "annotations": {}}, {"name": "weather-tools-get-forecast", "description": "Get a made-up multi-day forecast for a city.", "inputSchema": {"properties": {"city": {"title": "City", "type": "string"}, "days": {"default": 3, "title": "Days", "type": "integer"}}, "required": ["city"], "title": "get_forecastArguments", "type": "object"}, "annotations": {}}, {"name": "calculator-tools-add", "description": "Add two numbers and return the sum.", "inputSchema": {"properties": {"a": {"title": "A", "type": "number"}, "b": {"title": "B", "type": "number"}}, "required": ["a", "b"], "title": "addArguments", "type": "object"}, "outputSchema": {"properties": {"result": {"title": "Result", "type": "number"}}, "required": ["result"], "title": "addOutput", "type": "object"}, "annotations": {}}]}}

                Tools reachable through virtual server 'toy-tools':
                  - calculator-tools-subtract: Subtract b from a and return the difference.
                  - calculator-tools-multiply: Multiply two numbers and return the product.
                  - weather-tools-get-weather: Get the current made-up weather for a city.
                  - weather-tools-get-forecast: Get a made-up multi-day forecast for a city.
                  - calculator-tools-add: Add two numbers and return the sum.
            # page: rec (view columns from workspace/view_service.py)
            view: { type: chip, page: rec, icon: log, text: "view tab: tool · time · success · response time", color: ok, scale: 0.8, pos: [500, 280] }
            nocaller: { type: text, page: rec, text: "no caller column", size: 38, color: bad, pos: [500, 430] }
            tadd:
              type: terminal
              command: "python3 -B call_tool.py calculator-tools-add '{\"a\": 17, \"b\": 25}'"
              show: "0,2,5-6"
              highlight:
                - { id: door, match: "/servers/[0-9a-f]+/mcp", lines: "^-->", color: gateway }
                - { id: answer, match: "42\\.0", lines: "^  42", color: ok }
              output: |
                --> POST http://127.0.0.1:4744/servers/66fb78f21dc64587af61e4c36fe54b1f/mcp
                    {"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "calculator-tools-add", "arguments": {"a": 17, "b": 25}}}
                <-- HTTP 200
                    {"jsonrpc": "2.0", "id": 2, "result": {"content": [{"type": "text", "text": "42.0"}], "structuredContent": {"result": 42.0}, "isError": false}}

                Result:
                  42.0
            # page: recap
            k1: { type: chip, page: recap, text: "registered once", color: gateway, pos: [500, 120] }
            k2: { type: chip, page: recap, icon: gateway, text: "one address", color: agent, pos: [500, 225] }
            k3: { type: chip, page: recap, icon: key, text: "one credential", color: yellow, pos: [500, 330] }
            k4: { type: chip, page: recap, icon: log, text: "one place", color: ok, pos: [500, 435] }
            thirty: { type: text, page: recap, text: "10 + 20 = 30", size: 52, color: gateway, pos: [500, 580] }
            # page: cta
            cta: { type: chip, page: cta, text: "Open the lab · See how tools reach an agent", color: user, pos: [500, 300] }
            next: { type: text, page: cta, text: "Next: should every agent see every tool?", size: 40, pos: [500, 450] }
        beats:
          - { at: "Ten AI agents", ring: ag }
          - { at: "twenty MCP servers", show: sv }
          - { at: "two hundred", pause: 0.7 }
          - { at: "two hundred", show: direct }
          - { at: "secret", show: secrets }
          - { at: "One box", pause: 1.3 }
          - { at: "One box", show: [box, hub], hide: direct, dim: secrets, move: { box: [500, 440] }, stagger: 0.6 }

      # 2. Zoom in: three by five
      - id: zoom
        vo: >-
          To see why, take three agents and five servers. Larkfield's Support,
          Billing and Ops were each wired to weather, calculator, orders, docs
          and maps: fifteen lines, drawn one by one.
        beats:
          - { page: zoom, transition: erase, pause: 0.8 }
          - { at: "take three agents", show: al }
          - { at: "and five servers", pause: 1.15 }
          - { at: "and five servers", show: sl }
          - { at: "Larkfield's Support", ring: al }
          - { at: "weather, calculator", ring: sl }
          - { at: "fifteen lines", show: m15 }

      # 3. What each line costs
      - &v2cost
        id: cost
        vo: >-
          Each line meant an address and a credential, a secret proving who is
          asking, kept inside that agent. Fifteen credentials, and every new
          server meant changing all three agents again.
        beats:
          - { page: cost, transition: erase, pause: 0.8 }
          - { at: "a credential", show: keys3 }
          - { at: "Fifteen credentials", show: cnt3 }
          - { at: "and every new server", pause: 0.4 }
          - { at: "every new server", show: [new3, m3new], stagger: 0.4 }
          - { at: "changing all three agents", ring: al3, text: { al3/0: "Support · update", al3/1: "Billing · update", al3/2: "Ops · update" } }

      # 4. An MCP gateway (Maren is our fictional platform lead)
      - &v2gateway
        id: gateway
        vo: >-
          So Maren, Larkfield's platform lead, put one program in the middle: an
          MCP gateway. A gateway is a proxy, a program that receives each call
          and passes it on.
        beats:
          - { page: gateway, transition: erase, pause: 0.8 }
          - { at: "So Maren", show: maren }
          - { at: "an MCP gateway", show: [gw, m4in, m4out], stagger: 0.3 }
          - { at: "a proxy", text: { gw: { sub: "proxy: receives each call, passes it on" } } }
          - { at: "receives each call", travel: [pk4a, pk4b], stagger: 1.2 }

      # 5. Two faces (same page)
      - &v2faces
        id: faces
        vo: >-
          To the agents, the gateway looks like a single MCP server. To the real
          servers it acts as their MCP client, the role each agent played
          before.
        beats:
          - { at: "a single MCP server", show: face1 }
          - { at: "their MCP client", show: face2 }

      # 6. Registration (the operator's act, not the server's)
      - &v2reg
        id: reg
        vo: >-
          An operator then registered each server with the gateway once, by
          name and address; the server did nothing. The gateway connected and
          fetched each menu with tools/list.
        beats:
          - { page: reg, transition: erase, pause: 0.8 }
          - { at: "An operator", show: [op, opwire], stagger: 0.4 }
          - { at: "the server did nothing", show: unch, ring: sl6 }
          - { at: "fetched each menu", travel: pk6 }

      # 7. The catalogue (same page)
      - &v2catalogue
        id: catalogue
        vo: >-
          The five menus landed in one list inside the gateway, its catalogue.
          One tools/list to the gateway now returned every tool from every
          server, in one reply.
        beats:
          - { at: "its catalogue", show: cat }
          - { at: "One tools/list", travel: pk7a }
          - { at: "in one reply", travel: pk7b }

      # 8. One address, one credential (3 + 5 = 8)
      - &v2addr
        id: addr
        vo: >-
          So each agent kept one address, the gateway's, and one credential, its
          own; the servers' secrets moved into the gateway. Three agents plus
          five servers made eight connections instead of fifteen.
        beats:
          - { page: addr, transition: erase, pause: 0.8 }
          - { at: "one address", text: { gw8: { sub: "mcp.larkfield.internal" } }, ring: gw8 }
          - { at: "its own", show: badges }
          - { at: "moved into the gateway", move: { sec8: [530, 500] } }
          - { at: "eight connections", show: cnt8 }

      # 9. One place to watch
      - &v2watch
        id: watch
        vo: >-
          Every call passed through one place, so the gateway wrote a row for
          each: tool, time, how long it took, whether it worked and, from the
          credential, who asked.
        beats:
          - { page: watch, transition: erase, pause: 0.8 }
          - { at: "wrote a row", show: log }
          - { at: "each: tool", mark: tool }
          - { at: "time", mark: time }
          - { at: "how long", mark: dur }
          - { at: "whether it worked", mark: worked }
          - { at: "who asked", mark: who }

      # 10. What it is not
      - &v2not
        id: not
        vo: >-
          The gateway runs no tools and chooses none; the servers do the work,
          and the model chooses. An AI gateway is a different thing: it carries
          calls to language models.
        beats:
          - { page: not, transition: erase, pause: 0.8 }
          - { at: "no tools", strike: runs, color: { runs: bad } }
          - { at: "chooses none", strike: picks, color: { picks: bad } }
          - { at: "An AI gateway", show: aigw }

      # 11. In the lab (real terminal output)
      - &v2lab
        id: lab
        vo: >-
          In the lab the MCP gateway is ContextForge, IBM's open-source gateway,
          with two toy MCP servers registered. One tools/list to its address
          returned five tools from both.
        beats:
          - { page: lab, transition: slide, pause: 0.8, layout: split, run: tlist }
          - { at: "ContextForge", text: { gw11: "ContextForge" }, ring: gw11 }
          - { at: "its address", mark: url }
          - { at: "five tools", mark: [weather, calc] }

      # 12. The record in the lab (real terminal output)
      - &v2rec
        id: rec
        vo: >-
          Then add with seventeen and twenty-five returned forty-two, and the
          view tab showed it as a new row: tool, time, success, response time.
          There is no caller column.
        beats:
          - { page: rec, transition: slide, pause: 0.8, run: tadd }
          - { at: "forty-two", mark: answer }
          - { at: "the view tab", show: view }
          - { at: "There is no caller column", show: nocaller }

      # 13. Recap
      - &v2recap
        id: recap
        vo: >-
          Focus on what changed. Servers registered once, one address and one
          credential per agent, one row per call in one place. Ten agents,
          twenty servers: thirty connections, not two hundred.
        beats:
          - { page: recap, transition: erase, pause: 0.8, layout: canvas }
          - { at: "Servers registered once", show: k1 }
          - { at: "one address", pause: 0.3 }
          - { at: "one address", show: k2 }
          - { at: "and one credential", pause: 1.15 }
          - { at: "one credential", show: k3 }
          - { at: "in one place", show: k4 }
          - { at: "thirty connections", show: thirty }

      # 14. Call to action
      - &v2cta
        id: cta
        vo: >-
          Open the lab, See how tools reach an agent, and find your own calls in
          the view tab. Next, a refund tool shows up on Support's menu.
        beats:
          - { page: cta, transition: erase, pause: 0.8 }
          - { at: "Open the lab", show: cta }
          - { at: "Next", show: next }

