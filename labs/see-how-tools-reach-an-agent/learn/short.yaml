            sl6: { type: list, page: reg, font: hand, scale: 0.8, items: [{ text: Weather, color: weather }, { text: Calculator, color: calc }, { text: Orders, color: orders }, { text: Docs, color: docs }, { text: Maps, color: maps }], pos: [800, 400], visible: true }
