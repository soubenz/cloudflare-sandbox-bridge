            tout: { type: chip, page: trace, icon: clock, text: "timed out", color: bad, pos: [875, 470] }
            e1: { type: arrow, from: ag4, to: gw4, color: agent }
            e2: { type: arrow, from: gw4, to: ws4, color: gateway }
            e3: { type: arrow, from: ws4, to: cloud, color: weather }
            k1: { type: packet, on: e1, label: "get_forecast · Leeds", color: agent, scale: 0.75, lift: 46 }
            k2: { type: packet, on: e2, label: "get_forecast · Leeds", color: agent, scale: 0.75, lift: 46 }
            k3: { type: packet, on: e3, label: "fetch Leeds", color: weather, scale: 0.75, lift: 46 }
            # page: reply (shape: a tool execution error; the message text is illustrative)
            reply6:
              type: card
              page: reply
              title: "the reply (simplified)"
              color: quiet
              scale: 1.25
              pos: [500, 300]
              lines: ['"result": {', '  "isError": true,', '  "content": text "Weather service timed out"', '}']
              highlight:
                - { id: err6, match: '"isError": true', color: bad }
                - { id: msg6, match: '"Weather service timed out"', color: user }
            tee: { type: text, page: reply, text: "tool execution error", size: 44, color: bad, pos: [500, 560] }
            # page: wrong
            code7:
              type: card
              page: wrong
              title: "assistant code (illustration)"
              color: quiet
              pos: [300, 200]
              lines: ["if resp.status == 200: return resp.result"]
              highlight:
                - { id: h200, match: "200", color: ok }
            reply7:
              type: card
              page: wrong
              title: "the reply"
              color: quiet
              pos: [810, 200]
              lines: ['"isError": true']
              highlight:
                - { id: err7, match: '"isError": true', color: bad }
            model7: { type: chip, page: wrong, icon: model, text: "Model", color: model, pos: [500, 430], visible: true }
            guess7: { type: stamp, page: wrong, text: "Guess", color: bad, rotate: -8, pos: [500, 570] }
            # page: protocol (lab-real: ContextForge 1.0.10 answered tools/calll with HTTP 200 and this error object)
            plabel: { type: text, page: protocol, text: "protocol error", size: 44, color: bad, pos: [500, 60] }
            req8: { type: card, page: protocol, title: "request", color: agent, lines: ['"method": "tools/calll"'], pos: [500, 175] }
            err8:
              type: card
              page: protocol
              title: "the reply"
              color: bad
              pos: [500, 375]
              lines: ['"error": {', '  "code": -32601,', '  "message": "Method not found: tools/calll"', '}']
              highlight:
                - { id: code8, match: "-32601", color: bad }
            nores: { type: text, page: protocol, text: "no result", size: 38, color: bad, pos: [500, 555] }
            spec8: { type: text, page: protocol, text: "2026-07-28 spec: some protocol errors also get 400/404", size: 22, color: quiet, pos: [500, 650], visible: true }
            # page: which (the spec's two lists)
            perr: { type: list, page: which, title: "protocol error · error object", gate: true, visible: true, font: hand, scale: 0.8, color: bad, items: [{ text: "unknown tool", color: bad }, { text: "malformed request", color: bad }, { text: "server error", color: bad }], pos: [260, 300] }
            terr9: { type: list, page: which, title: "tool execution error · isError", gate: true, visible: true, font: hand, scale: 0.8, color: yellow, items: [{ text: "failed API", color: yellow }, { text: "bad input", color: yellow }, { text: "business rule", color: yellow }], pos: [745, 300] }
            formodel: { type: text, page: which, text: "written for the model", size: 32, color: yellow, pos: [745, 520] }
            # page: lab (real terminal output; then the specification beside it)
            spec11: { type: chip, page: lab, text: "spec: unknown tool → protocol error", color: quiet, scale: 0.9, pos: [500, 130] }
            cf11: { type: chip, page: lab, text: "ContextForge 1.0.10 → isError result", color: gateway, scale: 0.9, pos: [500, 260] }
            sdk11: { type: text, page: lab, text: "MCP Python SDK: any failure in a tool → isError", size: 28, color: quiet, pos: [500, 385] }
            body11: { type: chip, page: lab, icon: check, text: "read the body", color: ok, pos: [500, 520] }
            terr:
              type: terminal
              command: "python3 -B call_tool.py does-not-exist '{}'"
              show: "1-4"
              highlight:
                - { id: s200, match: "HTTP 200", color: ok }
                - { id: iserr, match: "\"isError\": true", color: bad }
                - { id: notfound, match: "Tool not found: does-not-exist", color: user }
              output: |
                --> POST http://127.0.0.1:4744/servers/66fb78f21dc64587af61e4c36fe54b1f/mcp
                    {"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "does-not-exist", "arguments": {}}}
                <-- HTTP 200
                    {"jsonrpc": "2.0", "id": 2, "result": {"content": [{"type": "text", "text": "Tool not found: does-not-exist"}], "isError": true}}
                call_tool: 'does-not-exist' reported an error: [{'type': 'text', 'text': 'Tool not found: does-not-exist'}]
            # page: careful ("fetch the menu again" and "retry once" are our advice, not spec rules)
            reply12: { type: node, page: careful, icon: mail, label: "reply", color: model, scale: 0.8, pos: [110, 330], visible: true }
            b1: { type: chip, page: careful, text: "error object → agent's code: fix the request", color: bad, scale: 0.8, pos: [450, 170] }
            tl12: { type: chip, page: careful, font: mono, text: "tools/list", color: agent, pos: [885, 170] }
            b2: { type: chip, page: careful, text: "isError → model reads the text", color: yellow, scale: 0.8, pos: [430, 450] }
            leaves: { type: list, page: careful, gate: true, visible: true, font: hand, scale: 0.8, items: [{ text: "fix an input", color: model }, { text: "retry once", color: model }, { text: "admit", color: model }], pos: [830, 450] }
            sorry: { type: bubble, page: careful, text: "Sorry, I have no forecast for Leeds right now.", color: ok, side: left, width: 560, pos: [560, 625] }
            l1: { type: arrow, from: reply12, to: b1, color: bad }
            l2: { type: arrow, from: b1, to: tl12, color: bad }
            l3: { type: arrow, from: reply12, to: b2, color: yellow }
            l4: { type: arrow, from: b2, to: leaves, color: yellow }
            # page: recap
            t1: { type: chip, page: recap, icon: mail, text: "status · the message arrived", color: ok, pos: [500, 160] }
            t2: { type: chip, page: recap, icon: log, text: "body · whether the tool worked", color: yellow, pos: [500, 300] }
            t3: { type: chip, page: recap, icon: check, text: "read it · told the truth", color: agent, pos: [500, 440] }
            # page: cta
            cta: { type: chip, page: cta, text: "Open the lab · See how tools reach an agent", color: user, pos: [500, 280] }
            four: { type: list, page: cta, row: true, font: hand, scale: 0.85, items: [{ text: server, color: weather }, { text: gateway, color: gateway }, { text: "virtual server", color: gateway }, { text: failure, color: bad }], pos: [500, 450] }
        beats:
          - { at: "This line", mark: ok1 }
          - { at: "your AI agent makes things up", show: guess1 }
          - { at: "when a tool fails", pause: 0.6 }
          - { at: "when a tool fails", show: reply1, mark: err1 }

      # 2. Status and body (the payoff within 20 s)
      - id: status
        vo: >-
          HTTP 200 only says the request was delivered and answered. Whether the
          tool worked is written in the body, next to isError, and this line
          never reads it.
        beats:
          - { page: status, transition: erase, pause: 0.8 }
          - { at: "HTTP 200", show: s200 }
          - { at: "delivered and answered", show: sdel }
          - { at: "in the body", show: body }
          - { at: "next to isError", mark: err2 }
          - { at: "this line never reads it", show: [code2, unread], stagger: 0.5, mark: st2 }

      # 3. Snow in Leeds, again
      - id: again
        vo: >-
          Larkfield's support assistant had that line. At eight one Thursday it
          told a customer to expect heavy snow in Leeds, and again, no snow
          fell.
        beats:
          - { page: again, transition: erase, pause: 0.8 }
          - { at: "that line", show: code3 }
          - { at: "expect heavy snow", show: said3 }
          - { at: "and again", pause: 0.6 }
          - { at: "and again", show: nosnow3 }

      # 4. Follow the call
      - id: trace
        vo: >-
          Tomas, the staff engineer, pulled the trace. The assistant had called
          get_forecast for Leeds through the MCP gateway, which passed it to the
          weather MCP server.
        beats:
          - { page: trace, transition: erase, pause: 0.8 }
          - { at: "Tomas", show: tomas }
          - { at: "The assistant had called", show: [ag4, e1], stagger: 0.3 }
          - { at: "get_forecast for Leeds", travel: k1 }
          - { at: "the MCP gateway", show: gw4 }
          - { at: "passed it", travel: k2 }
          - { at: "the weather MCP server", show: [ws4, e2], stagger: 0.2 }

      # 5. The far end (same page)
      - id: farend
        vo: >-
          That server asked an outside weather service for its data, and the
          service did not answer in time. The chain had broken at its far end.
        beats:
          - { at: "an outside weather service", show: [cloud, e3], stagger: 0.3 }
          - { at: "for its data", travel: k3 }
          - { at: "did not answer", show: tout, color: { cloud: bad } }
          - { at: "its far end", ring: cloud }

      # 6. The reply: a tool execution error
      - id: reply
        vo: >-
          The weather server did not crash. It sent a normal result with isError
          true and a short text: weather service timed out. The specification
          calls this a tool execution error.
        beats:
          - { page: reply, transition: erase, pause: 0.8 }
          - { at: "a normal result", show: reply6 }
          - { at: "isError true", mark: err6 }
          - { at: "a short text", mark: msg6 }
          - { at: "a tool execution error", show: tee }

      # 7. What went wrong
      - id: wrong
        vo: >-
          Tomas found the line from the start. It took 200 as proof and never
          read isError, so the model never learned the tool had failed, and
          filled the gap with a guess.
        beats:
          - { page: wrong, transition: erase, pause: 0.8 }
          - { at: "the line", show: code7 }
          - { at: "took 200", mark: h200 }
          - { at: "never read isError", show: reply7, mark: err7 }
          - { at: "isError", strike: reply7 }
          - { at: "a guess", show: guess7 }

      # 8. The other kind: a protocol error
      - id: protocol
        vo: >-
          The second kind is the protocol error: the server could not handle
          the request itself, say a misspelt method name. The reply holds an
          error object, code and message, and no result.
        beats:
          - { page: protocol, transition: erase, pause: 0.8 }
          - { at: "the protocol error", show: plabel }
          - { at: "a misspelt method name", show: req8 }
          - { at: "an error object", show: err8 }
          - { at: "code and message", mark: code8 }
          - { at: "no result", show: nores }

      # 9. Which is which
      - id: which
        vo: >-
          The specification sorts them: unknown tool and malformed request are
          protocol errors. A failed API, a bad input or a business rule are tool
          execution errors, written for the model to correct itself.
        beats:
          - { page: which, transition: erase, pause: 0.8 }
          - { at: "unknown tool", show: perr/0 }
          - { at: "and malformed request", pause: 1.05 }
          - { at: "malformed request", show: [perr/1, perr/2], stagger: 0.4 }
          - { at: "A failed API", pause: 0.5 }
          - { at: "A failed API", show: terr9/0 }
          - { at: "a bad input", pause: 0.8 }
          - { at: "a bad input", show: terr9/1 }
          - { at: "or a business rule", pause: 1.15 }
          - { at: "a business rule", show: terr9/2 }
          - { at: "correct itself", show: formodel }

      # 10. In the lab (real terminal output)
      - id: lab
        vo: >-
          In the lab, a call to a tool named does-not-exist came back with HTTP
          200, isError set to true, and the text: Tool not found.
        beats:
          - { page: lab, transition: slide, pause: 0.8, layout: split, run: terr }
          - { at: "HTTP 200", mark: s200 }
          - { at: "isError set to true", mark: iserr }
          - { at: "Tool not found", mark: notfound }

      # 11. Lab versus specification (same page)
      - id: versus
        vo: >-
          The specification files an unknown tool under protocol errors.
          ContextForge reports a tool error, because the MCP Python SDK beneath
          it turns any failure in a tool into one. The shape depends on the
          server.
        beats:
          - { at: "The specification", show: spec11 }
          - { at: "ContextForge reports", show: cf11 }
          - { at: "because the MCP Python SDK", pause: 0.3 }
          - { at: "the MCP Python SDK", show: sdk11 }
          - { at: "depends on the server", show: body11 }

      # 12. A careful agent: the error object
      - id: careful
        vo: >-
          So a careful agent reads the body. On an error object, its own code
          steps in, say by fetching the menu again.
        beats:
          - { page: careful, transition: erase, pause: 0.8, layout: canvas }
          - { at: "an error object", show: [b1, l1], stagger: 0.3 }
          - { at: "fetching the menu again", show: [tl12, l2], stagger: 0.3 }

      # 13. A careful agent: isError (same page)
      - id: careful2
        vo: >-
          On isError it hands the text to the model, which can fix an input,
          retry once, or admit it has no forecast.
        beats:
          - { pause: 0.4 }
          - { at: "On isError", show: [b2, l3, l4], stagger: 0.3 }
          - { at: "fix an input", show: leaves/0 }
          - { at: "retry once", pause: 0.9 }
          - { at: "retry once", show: leaves/1 }
          - { at: "or admit", pause: 0.65 }
          - { at: "admit", show: [leaves/2, sorry], stagger: 0.6 }

      # 14. Recap
      - id: recap
        vo: >-
          Focus on what just happened. The status said the message arrived, the
          body said whether the tool worked, and the agent that read it told the
          truth instead of guessing.
        beats:
          - { page: recap, transition: erase, pause: 0.8 }
          - { at: "The status said", show: t1 }
          - { at: "the body said", pause: 0.3 }
          - { at: "the body said", show: t2 }
          - { at: "told the truth", show: t3 }

      # 15. Call to action (the last video of the set)
      - id: cta
        vo: >-
          Open the lab, See how tools reach an agent, and call a tool that does
          not exist. That closes the four videos: server, gateway, virtual
          server, failed call.
        beats:
          - { page: cta, transition: erase, pause: 0.8 }
          - { at: "Open the lab", show: cta }
          - { at: "the four videos", show: four }
