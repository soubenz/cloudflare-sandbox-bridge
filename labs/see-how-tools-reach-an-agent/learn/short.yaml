          server for each one. One catalogue of twelve tools, three agents,
          three different menus.
        scene:
          id: virtual
          pages: [{ id: hook }, { id: vs }, { id: every }, { id: wrong }, { id: sup }, { id: bill }, { id: search }, { id: sees }, { id: lock }, { id: lab }, { id: recap }, { id: cta }]
