# Explainer videos for this lab, one idea each (docs/shorts.md). Render with:
#   node scripts/shorts/render.mjs labs/see-how-tools-reach-an-agent/learn/short.yaml
# Each video renders to <id>-vertical.mp4, <id>-landscape.mp4, <id>-landscape.jpg
# and <id>.vtt, and may not run past 180 s.
#
# The four videos are the approved scripts in docs/research/mcp-gateway-scripts.md,
# one segment per table row and one board page per row: the segment's `vo` is the
# row's VOICE cell word for word (approved copy; do not reword it here), and each
# ON SCREEN element appears on its [cue] word. Page breaks erase the board ("in the
# lab" pages slide) with 0.8 s of quiet. Where two cues fall closer than
# pace.minBeatGap, a `pause` opens a little quiet at the nearest phrase break
# rather than rushing the board.
#
# Terminal output is real: call_tool.py run against this lab's own services
# (ContextForge 1.0.10 with weather-tools and calculator-tools, set up by
# seed_contextforge.py), copied verbatim. A terminal shows a subset of the
# lines (`show`) and may shorten long ones (`clip`); it never edits them.
# Cards are illustrations and say so where it matters.

# workers-ai:<speaker> makes the narration with Workers AI. The owner's preferred
# narrator (ElevenLabs "Mark") goes in through the dir: slot: set
#   voice: dir:learn/voice/<video id>
# on a video, with 01.mp3, 02.mp3, ... (one clip per segment, in order) and a
# manifest.json holding each segment's vo (docs/shorts.md, "Pre-made narration").
voice: workers-ai:arcas
theme: navy              # navy (the site's blue) | black
captions: small          # off | small | karaoke

# Slow by default (docs/shorts.md, "Pace").
pace:
  enter: 0.7             # an element's entrance (pop, write-on, draw-on)
  packet: 1.2            # seconds per hop for a packet
  beatHold: 1.3          # a segment's last beat holds this long before the next voice
                         # (every page break adds 0.8 s of quiet on top, so the board still rests)
  minBeatGap: 2.0        # warn when elements arrive closer together than this
  pageTransition: 0.6    # erase / slide / zoom / fade between pages
  pageMax: 6             # warn when a page has more elements than this
  drift: 4               # a very small camera drift (0: still)
  gap: 0.7               # quiet between two segments, seconds
  maxPause: 0.6          # longest pause kept inside one clip
  tail: 2.5              # hold after the last word; the end card eases in here
  minOutputHold: 4.0     # terminal output stays this long after its last highlight
  transition: 0.7        # a soft cross-fade between scenes
  typing: 16             # characters per second when a command is typed

# One colour per actor, the same in every video and on every chip, node,
# packet and terminal highlight (docs/research/mcp-gateway-scripts.md).
colors:
  agent: blue
  weather: cyan
  calc: yellow
  gateway: violet
  user: orange
  model: white
  ok: green
  bad: red
  quiet: grey
  orders: pink           # the Larkfield examples' illustrative servers
  docs: grey
  maps: grey

videos:
  # ==========================================================================
  # Video 1. What is MCP?
  - id: mcp-what-is-mcp
    title: What is MCP?
    endCard: { title: "What is MCP?", sub: "Hands-on lab · See how tools reach an agent" }
    segments:
      # 1. Hook: ChatGPT and today's weather
      - id: hook
        vo: >-
          ChatGPT's knowledge stopped months ago. Ask it today's weather, and it
          still knows. How? Follow one answer, the weather in Leeds, from a
          weather service into the chat.
        scene:
          id: mcp
          pages:
            - { id: hook }
            - { id: answer }
            - { id: snow }
            - { id: agent }
            - { id: server }
            - { id: rpc }
            - { id: menu }
            - { id: choose }
            - { id: call }
            - { id: lab }
            - { id: recap }
            - { id: cta }
          elements:
            # page: hook (an illustration: no claim about how ChatGPT gets weather)
            kicker: { type: kicker, page: hook, text: "Interview question", pos: [500, 34], visible: true }
            q: { type: title, page: hook, text: "ChatGPT was trained months ago. How does it know today's weather?", size: 48, width: 920, pos: [500, 128], underline: true, visible: true }
            topic: { type: text, page: hook, text: "What is MCP?", size: 32, color: quiet, pos: [500, 236], visible: true }
            chat:
              type: chat
              page: hook
              title: "ChatGPT · 🕒 now"
              color: model
              width: 480
              pos: [745, 450]
              visible: true
              messages:
                - { text: "What's the weather in Leeds right now?", side: right, color: user }
                - { text: "Leeds, right now: 10 °C, cloudy", side: left, color: weather }
              highlight:
                - { id: leeds, match: "Leeds", lines: "^Leeds", color: weather }
            cal: { type: chip, page: hook, icon: calendar, text: "training data ends: months ago", color: quiet, scale: 0.8, pos: [240, 345] }
            model: { type: chip, page: hook, icon: model, text: "Model", color: model, pos: [240, 470] }
            ask: { type: arrow, from: model, to: chat, label: "?", labelSize: 56, color: user }
            # page: answer
            appbox: { type: box, page: answer, label: "the app around it", color: quiet, size: [560, 330], pos: [330, 360] }
            lm: { type: node, page: answer, icon: model, label: "Language model", sub: "reads text, writes text", color: model, scale: 0.85, pos: [330, 320] }
            cant: { type: chip, page: answer, icon: cross, text: "cannot know", sub: "training ended months ago", color: bad, scale: 0.8, pos: [330, 445] }
            tool: { type: chip, page: answer, text: "tool", sub: "fetches live data", color: weather, pos: [830, 360] }
            a_out: { type: arrow, from: appbox, to: tool, color: weather, offset: -14 }
            a_back: { type: arrow, from: tool, to: appbox, color: weather, offset: -14 }
            mcp: { type: text, page: answer, text: "MCP · the standard way to plug tools in", size: 36, color: gateway, pos: [500, 610] }
            # page: snow (illustrative story: Larkfield is our fictional company)
            when3: { type: text, page: snow, text: "Tuesday 09:00", size: 32, color: quiet, pos: [500, 40], visible: true }
            asst: { type: node, page: snow, icon: agent, label: "Support assistant", color: agent, scale: 0.8, pos: [235, 330] }
            said: { type: bubble, page: snow, text: "Yes, heavy snow in Leeds.", color: agent, side: left, width: 420, pos: [690, 220] }
            nosnow: { type: stamp, page: snow, text: "No snow", color: bad, rotate: -8, pos: [700, 380] }
            slot: { type: box, page: snow, label: "tool", color: quiet, size: [240, 100], pos: [235, 520] }
            # page: agent (the agent, then a tool on the same page)
            abox: { type: box, page: agent, label: "Agent", color: agent, size: [360, 300], pos: [250, 380] }
            model2: { type: chip, page: agent, icon: model, text: "Model", color: model, pos: [250, 400], visible: true }
            duties: { type: list, page: agent, gate: true, font: hand, scale: 0.8, items: [{ text: "keeps the conversation", color: agent }, { text: "carries out what the model decides", color: agent }], pos: [720, 165] }
            ollie: { type: node, page: agent, icon: user, label: "Ollie", sub: "built it", color: user, scale: 0.85, pos: [830, 600] }
            progbox: { type: box, page: agent, label: "another program", color: quiet, size: [500, 150], pos: [715, 410] }
            getw: { type: chip, page: agent, font: mono, text: "get_weather", color: weather, pos: [715, 430] }
            # page: server (the MCP server, then the MCP client on the same page)
            abox2: { type: box, page: server, label: "Agent", color: agent, size: [320, 300], pos: [210, 390], visible: true }
            client: { type: chip, page: server, text: "MCP client", color: agent, pos: [210, 430] }
            host: { type: text, page: server, text: "host", size: 32, color: quiet, pos: [210, 200] }
            srv: { type: card, page: server, title: "Weather MCP server", color: weather, lines: ["get_weather", "get_forecast"], pos: [730, 300] }
            srv2: { type: node, page: server, icon: server, label: "… MCP server", color: quiet, scale: 0.7, pos: [730, 490] }
            mcpname: { type: text, page: server, text: "MCP · Model Context Protocol", size: 36, color: gateway, pos: [500, 630] }
            wire: { type: arrow, from: client, to: srv, label: "MCP", color: gateway }
            # page: rpc
            req: { type: card, page: rpc, title: "request", color: agent, lines: ['{"method": "tools/list", "params": {}}'], scale: 1.15, pos: [500, 190] }
            res: { type: card, page: rpc, title: "reply", color: ok, lines: ['{"result": …}'], scale: 1.15, pos: [290, 450] }
            err: { type: card, page: rpc, title: "reply", color: bad, lines: ['{"error": …}'], scale: 1.15, pos: [710, 450] }
            # page: menu (real names, descriptions and schemas from the lab's tools/list)
            mclient: { type: chip, page: menu, text: "MCP client", color: agent, pos: [170, 100], visible: true }
            msrv: { type: chip, page: menu, text: "Weather MCP server", color: weather, pos: [790, 100], visible: true }
            mwire: { type: arrow, from: mclient, to: msrv, color: quiet, visible: true }
            p_list: { type: packet, on: mwire, label: "tools/list", color: agent }
            menu:
              type: card
              page: menu
              title: "menu"
              color: weather
              pos: [500, 420]
              lines:
                - "get_weather"
                - '  "Get the current made-up weather for a city."'
                - { text: "  city · string · required", reveal: s1 }
                - "get_forecast"
                - '  "Get a made-up multi-day forecast for a city."'
                - { text: "  days · integer · default 3", reveal: s2 }
              highlight:
                - { id: d1, match: '"Get the current made-up weather for a city\.?"', color: weather }
                - { id: s1, match: "city · string · required", color: agent }
                - { id: s2, match: "days · integer · default 3", color: agent }
            # page: choose (illustrative: the lab has no model; the learner plays the client)
            model3: { type: chip, page: choose, icon: model, text: "Model", color: model, pos: [660, 300], visible: true }
            q11: { type: bubble, page: choose, text: "Is it snowing in Leeds?", color: user, side: right, width: 420, pos: [270, 150] }
            menu2: { type: list, page: choose, title: "menu", items: [{ text: get_weather, color: weather }, { text: get_forecast, color: weather }], pos: [200, 400] }
            req11: { type: chip, page: choose, font: mono, text: "call get_weather · city: Leeds", color: agent, pos: [680, 450] }
            ran: { type: text, page: choose, text: "writes the request, runs nothing", size: 32, color: quiet, pos: [660, 580] }
            # page: call
            cclient: { type: chip, page: call, text: "MCP client", color: agent, pos: [300, 110], visible: true }
            csrv: { type: chip, page: call, text: "Weather MCP server", color: weather, pos: [300, 590], visible: true }
            cwire: { type: arrow, from: cclient, to: csrv, color: quiet, visible: true }
            p_call: { type: packet, on: cwire, label: "tools/call · get_weather · {city: Leeds}", color: agent, scale: 0.85, dur: 1.6 }
            p_res: { type: packet, on: cwire, reverse: true, label: "result", color: ok, dur: 1.4 }
            rcard:
              type: card
              page: call
              title: "result"
              color: ok
              pos: [770, 350]
              lines: ['content: "Leeds, 10 °C, cloudy"', "isError: false"]
              highlight:
                - { id: content, match: '"Leeds, 10 °C, cloudy"', color: ok }
            # page: lab
            toy: { type: chip, page: lab, icon: server, text: "toy server · numbers made up", color: quiet, pos: [500, 350] }
            term:
              type: terminal
              command: "python3 -B call_tool.py weather-tools-get-weather '{\"city\": \"Leeds\"}'"
              show: "0-2,5-10"
              highlight:
                - { id: method, match: "\"method\": \"tools/call\"", color: agent }
                - { id: name, match: "weather-tools-get-weather", lines: "\"method\"", color: weather }
                - { id: result, match: "\"(temperature_c|conditions)\": [^,]+", lines: "^  \"", color: ok }
              output: |
                --> POST http://127.0.0.1:4744/servers/66fb78f21dc64587af61e4c36fe54b1f/mcp
                    {"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "weather-tools-get-weather", "arguments": {"city": "Leeds"}}}
                <-- HTTP 200
                    {"jsonrpc": "2.0", "id": 2, "result": {"content": [{"type": "text", "text": "{\n  \"city\": \"Leeds\",\n  \"temperature_c\": 10,\n  \"conditions\": \"cloudy\"\n}"}], "isError": false}}

                Result:
                  {
                  "city": "Leeds",
                  "temperature_c": 10,
                  "conditions": "cloudy"
                }
            # page: recap
            r1: { type: chip, page: recap, text: "1  tools/list · the menu", color: agent, pos: [500, 150] }
            r2: { type: chip, page: recap, text: "2  the model picks", color: model, pos: [500, 270] }
            r3: { type: chip, page: recap, text: "3  tools/call · run by name", color: agent, pos: [500, 390] }
            r4: { type: chip, page: recap, text: "4  a result", color: ok, pos: [500, 510] }
            # page: cta
            cta: { type: chip, page: cta, text: "Open the lab · See how tools reach an agent", color: user, pos: [500, 300] }
            next: { type: text, page: cta, text: "Next: 10 agents × 20 MCP servers", size: 40, pos: [500, 450] }
        beats:
          - { at: "months ago", show: [cal, model], stagger: 0.4 }
          - { at: "How", show: ask, ring: cal }
          - { at: "Leeds", mark: leeds }

      # 2. The answer: a tool
      - id: answer
        vo: >-
          The model, the part that reads and writes text, cannot know. The app
          around it calls a tool that fetches live data. MCP is the standard way
          to plug tools in.
        beats:
          - { page: answer, transition: erase, pause: 0.8 }
          - { at: "The model", show: lm }
          - { at: "cannot know", show: cant }
          - { at: "The app around it", pause: 1.1 }
          - { at: "The app around it", show: appbox }
          - { at: "calls a tool", pause: 1.2 }
          - { at: "calls a tool", show: [tool, a_out, a_back], stagger: 0.3 }
          - { at: "MCP is the standard way", pause: 0.5 }
          - { at: "MCP is the standard way", show: mcp }

      # 3. Snow in Leeds
      - id: snow
        vo: >-
          Without a tool, a model guesses. Larkfield's support assistant once
          reported heavy snow in Leeds, and none fell: nobody had given it a
          tool, so it had only its training.
        beats:
          - { page: snow, transition: erase, pause: 0.8 }
          - { at: "Larkfield's support assistant", show: [asst, said], stagger: 0.6 }
          - { at: "and none fell", show: nosnow }
          - { at: "nobody had given it a tool", pause: 0.8 }
          - { at: "nobody had given it a tool", show: slot }
          - { at: "given it a tool", strike: slot }

      # 4. The agent
      - id: agent
        vo: >-
          Around the model sits the agent, the program that keeps the
          conversation and carries out what the model decides. Ollie, the
          engineer who built the assistant, put his fix there.
        beats:
          - { page: agent, transition: erase, pause: 0.8 }
          - { at: "sits the agent", show: abox }
          - { at: "the program that keeps", pause: 0.5 }
          - { at: "keeps the conversation", show: [duties, duties/0] }
          - { at: "and carries out", pause: 1.0 }
          - { at: "and carries out", show: duties/1 }
          - { at: "Ollie", show: ollie }
          - { at: "his fix there", ring: abox }

      # 5. A tool (same page)
      - id: tool
        vo: >-
          He gave the agent a tool: get_weather, a function in another program
          that the agent runs for the model. It takes a city and returns today's
          weather.
        beats:
          - { at: "a tool", show: getw }
          - { at: "another program", show: progbox }
          - { at: "takes a city", text: { getw: { sub: "city in → weather out" } }, ring: getw }

      # 6. An MCP server
      - id: server
        vo: >-
          The program offering get_weather is an MCP server. MCP, the Model
          Context Protocol, is one shared way to ask any such program for its
          tools and run them.
        beats:
          - { page: server, transition: erase, pause: 0.8 }
          - { at: "an MCP server", show: srv }
          - { at: "the Model Context Protocol", show: mcpname }
          - { at: "any such program", show: srv2 }

      # 7. The MCP client (same page)
      - id: client
        vo: >-
          Inside the agent, a part called the MCP client holds the connection to
          exactly one MCP server. The protocol calls the agent itself the host.
        beats:
          - { at: "the MCP client", show: client }
          - { at: "exactly one", show: wire }
          - { at: "the host", show: host }

      # 8. Messages: JSON-RPC
      - id: rpc
        vo: >-
          Client and server exchange JSON documents in a format called JSON-RPC.
          A request names a method, and the reply carries either a result or an
          error. Remember that pair.
        beats:
          - { page: rpc, transition: erase, pause: 0.8 }
          - { at: "A request names", show: req }
          - { at: "the reply carries", show: res }
          - { at: "or an error", pause: 0.6 }
          - { at: "or an error", show: err }

      # 9. The menu: tools/list
      - id: menu
        vo: >-
          The client asked the server for its menu with tools/list. Back came
          each tool's name and a description written for the model: Get the
          current made-up weather for a city.
        beats:
          - { page: menu, transition: erase, pause: 0.8 }
          - { at: "menu", show: menu }
          - { at: "tools/list", travel: p_list }
          - { at: "Get the current made-up weather", mark: d1 }

      # 10. The input schema (same page)
      - id: schema
        vo: >-
          Under each name sits an input schema, the inputs a tool needs and
          their types. get_weather wants one, city, a string; get_forecast adds
          days, a whole number, three by default.
        beats:
          - { at: "an input schema", mark: s1 }
          - { at: "days", mark: s2 }

      # 11. The model chooses
      - id: choose
        vo: >-
          Then the agent handed the model the question and that menu, and the
          model answered with a request: call get_weather, city Leeds. It wrote
          the request; it ran nothing.
        beats:
          - { page: choose, transition: erase, pause: 0.8 }
          - { at: "handed the model the question", show: q11 }
          - { at: "and that menu", pause: 0.9 }
          - { at: "and that menu", show: menu2 }
          - { at: "a request", show: req11 }
          - { at: "it ran nothing", show: ran }

      # 12. The call: tools/call
      - id: call
        vo: >-
          So the client sent tools/call with the tool's name and arguments. The
          server ran it and replied with a result whose content held the answer:
          Leeds, ten degrees, cloudy.
        beats:
          - { page: call, transition: erase, pause: 0.8 }
          - { at: "tools/call", travel: p_call }
          - { at: "ran it", ring: csrv }
          - { at: "a result", travel: p_res }
          - { at: "whose content", show: rcard }
          - { at: "Leeds, ten degrees", mark: content }

      # 13. In the lab (real terminal output)
      - id: lab
        vo: >-
          In the lab you send this tools/call yourself. A toy server makes the
          weather up, and the name starts with weather-tools, a prefix the next
          video explains.
        beats:
          - { page: lab, transition: slide, pause: 0.8, layout: split, run: term }
          - { at: "tools/call yourself", mark: method }
          - { at: "A toy server", show: toy }
          - { at: "makes the weather up", mark: result }
          - { at: "the name starts with", mark: name }

      # 14. Recap
      - id: recap
        vo: >-
          Focus on what just happened. The client fetched the menu with
          tools/list, the model picked a tool, the client ran it with
          tools/call, and the weather returned as a result.
        beats:
          - { page: recap, transition: erase, pause: 0.8, layout: canvas }
          - { at: "fetched the menu with tools/list", show: r1 }
          - { at: "the model picked", pause: 0.2 }
          - { at: "the model picked", show: r2 }
          - { at: "the client ran it", pause: 0.6 }
          - { at: "the client ran it", show: r3 }
          - { at: "and the weather returned", show: r4 }

      # 15. Call to action
      - id: cta
        vo: >-
          Open the lab, See how tools reach an agent, and ask for the weather in
          Leeds yourself. Next: ten AI agents, twenty MCP servers, and two
          hundred connections.
        beats:
          - { page: cta, transition: erase, pause: 0.8 }
          - { at: "Open the lab", show: cta }
          - { at: "Next", show: next }

  # ==========================================================================
  # Video 2. Why an MCP gateway? (hook A, with variant B's kicker and question)
  - id: mcp-why-a-gateway
    title: Why an MCP gateway?
    endCard: { title: "Why an MCP gateway?", sub: "Hands-on lab · See how tools reach an agent" }
    segments:
      # 1. Hook: 200 connections (illustrative numbers)
      - id: hook
        vo: >-
          Ten AI agents, twenty MCP servers: two hundred connections, each with
          its own secret. One box in the middle makes it thirty.
        scene:
          id: gateway
          pages: [{ id: hook }, { id: hookb }, { id: zoom }, { id: cost }, { id: gateway }, { id: reg }, { id: addr }, { id: watch }, { id: not }, { id: lab }, { id: rec }, { id: recap }, { id: cta }]
          elements: &v2elements
            # page: hook (main cut)
            kicker: { type: kicker, page: hook, text: "Interview question", pos: [500, 34], visible: true }
            q: { type: title, page: hook, text: "10 agents, 20 MCP servers. How do you manage access?", size: 48, width: 920, pos: [500, 124], underline: true, visible: true }
            ag: { type: dots, page: hook, n: 10, size: 22, gap: 12, color: agent, pos: [120, 430], visible: true }
            sv: { type: dots, page: hook, n: 20, size: 13, gap: 3.5, color: quiet, pos: [880, 430] }
            direct: { type: mesh, page: hook, from: ag, to: sv, color: quiet, width: 1.2, opacity: 0.4, stagger: 0.004, label: "10 × 20 = 200 connections", labelPos: [400, 648] }
            secrets: { type: chip, page: hook, icon: key, text: "200 secrets", color: yellow, pos: [800, 648] }
            box: { type: node, page: hook, icon: gateway, color: gateway, pos: [500, 300] }
            hub: { type: mesh, page: hook, from: ag, to: sv, via: box, color: gateway, width: 1.6, opacity: 0.7, label: "10 + 20 = 30", labelPos: [400, 648], labelColor: gateway }
            # page: hookb (variant B only)
            kickerB: { type: kicker, page: hookb, text: "Interview question", pos: [500, 34], visible: true }
            qB: { type: title, page: hookb, text: "10 agents, 20 MCP servers. How do you manage access?", size: 48, width: 920, pos: [500, 124], underline: true, visible: true }
            agB: { type: dots, page: hookb, n: 10, size: 22, gap: 12, color: agent, pos: [120, 430], visible: true }
            svB: { type: dots, page: hookb, n: 20, size: 13, gap: 3.5, color: quiet, pos: [880, 430] }
            directB: { type: mesh, page: hookb, from: agB, to: svB, color: quiet, width: 1.2, opacity: 0.4, stagger: 0.004, label: "10 × 20 = 200 connections", labelPos: [500, 648] }
            keysB: { type: list, page: hookb, row: true, items: [{ text: "", icon: key, color: yellow }, { text: "", icon: key, color: yellow }, { text: "", icon: key, color: yellow }, { text: "", icon: key, color: yellow }], pos: [500, 560] }
            boxB: { type: node, page: hookb, icon: gateway, label: "MCP gateway", color: gateway, scale: 0.85, pos: [500, 300] }
            hubB: { type: mesh, page: hookb, from: agB, to: svB, via: boxB, color: gateway, width: 1.6, opacity: 0.7, label: "10 + 20 = 30", labelPos: [500, 648], labelColor: gateway }
            # page: zoom (Larkfield is our fictional company; orders, docs and maps are labels only)
            al: { type: list, page: zoom, font: hand, items: [{ text: Support, color: agent }, { text: Billing, color: agent }, { text: Ops, color: agent }], pos: [200, 330] }
