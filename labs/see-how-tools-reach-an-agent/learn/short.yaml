            q: { type: title, page: hook, text: "How do you give each AI agent only the tools it needs?", size: 48, width: 920, pos: [500, 124], underline: true, visible: true }
            topic: { type: text, page: hook, text: "MCP virtual servers", size: 32, color: quiet, pos: [500, 232], visible: true }
            cat1: { type: list, page: hook, title: "catalogue · 12 tools", cols: 3, scale: 0.6, items: [tool, tool, tool, tool, tool, tool, tool, tool, tool, tool, tool, tool], color: quiet, pos: [160, 450] }
