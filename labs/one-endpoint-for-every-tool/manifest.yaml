# A build lab, not break-fix: there is no planted one-liner. Three teams
# each built their own MCP tool server -- inventory, billing, search -- with
# no platform involved. All three are up and listening on their own ports.
# ContextForge is also up, but nothing is registered with it yet: no
# gateway, no virtual server, no token. There is no single endpoint a
# caller can reach any of these tools through, and no way to hand any
# caller less than "everything" -- because right now there is nothing to
# hand them at all. platform/setup.py is supposed to fix all of that by
# reconciling the gateway with platform/catalogue.yaml; as shipped, it does
# nothing.
#
# Everything here is proven live against mcp-contextforge-gateway 1.0.10
# under Python 3.12 (docs/spike.md-equivalent local proof for this lab; see
# the module-2 ContextForge feasibility investigation), and several of the
# load-bearing facts are worth restating because the obvious calls don't
# work first try:
#
#  1. ContextForge is in trusted-proxy mode (MCP_CLIENT_AUTH_ENABLED=false,
#     TRUST_PROXY_AUTH=true, TRUST_PROXY_AUTH_DANGEROUSLY=true): a request
#     carrying X-Authenticated-User: <PLATFORM_ADMIN_EMAIL> is an admin
#     request. The whole /v1/* management API -- registering a gateway,
#     creating a virtual server, minting a token -- works with that one
#     header and no bearer token; platform/setup.py, services/view.py and the
#     grader's own admin-plane reads all send it (CONTEXTFORGE_ADMIN_USER
#     overrides the value). A request with no header is anonymous and gets
#     403. A client token is a different thing: a call that carries a Bearer
#     token (and no header) is checked against that token's own scope, so
#     the scoped-token behaviour in points 5 and 6 is unchanged (confirmed
#     live: the token lists its own tools, is 403 on /v1/*, and is refused
#     on any other virtual server, with or without the header alongside
#     it). The header is only ever sent on the platform's own calls, never
#     with a client token, so a probe is always the token alone.
#  2. SSRF protection blocks a gateway URL that points at 127.0.0.1/
#     localhost by default -- SSRF_ALLOW_LOCALHOST=true turns that off. It
#     has to be on here since every tool server in this lab is loopback,
#     inside the same container.
#  3. A federated tool's name is `<gateway-name>-<tool-name>` with
#     underscores turned to hyphens (registering a gateway named
#     `billing` that exposes a tool called `charge_lookup` produces the
#     federated tool `billing-charge-lookup`) -- confirmed live, not
#     assumed from the docs.
#  4. Creating a virtual server takes a POST body shaped
#     `{"server": {"name": ..., "associated_tools": [...]}}` -- the field
#     is `associated_tools` (snake_case tool IDs), not the camelCase
#     `associatedTools` the read-back response shows; sending the response
#     shape back verbatim silently creates an empty bundle instead of
#     erroring.
#  5. Minting a token takes `{"scope": {"server_id": ..., "permissions":
#     [...]}}`, not top-level `server_id`/`resource_scopes` fields (those
#     names exist only in the read-back response, same trap as #4).
#     REQUIRE_TOKEN_EXPIRATION is on by default, so `expires_in_days` is
#     required too.
#  6. Tool filtering is enforced on every path that matters, confirmed
#     live: `tools/list` on a virtual server's own MCP endpoint only ever
#     lists the tools actually bundled into it; a direct `tools/call` for
#     a tool that exists on the gateway but isn't in that bundle is
#     refused ("Tool not found") rather than silently allowed; and a
#     scoped token is refused outright (403) against a *different* virtual
#     server's endpoint, and against every admin-plane endpoint
#     (listing gateways, creating another virtual server, minting another
#     token) -- a scoped client token cannot escalate itself.
#  7. DELETE /v1/tokens/{id} revokes, it does not free the token's name for
#     reuse by the same user -- a reconciliation script that re-mints a
#     token with the same fixed name on every run needs to account for
#     that (see workspace/platform/setup.py's own docstring; this is
#     intentionally left as part of the task, not spelled out there).
#  8. ContextForge's own admin UI is a `ui: true` tab here (service `admin`),
#     with no login form, by the same trusted-proxy header. Confirmed live
#     with a real browser (Playwright + chromium) through a
#     /sessions/<id>/services/admin/ path, no cookies:
#      - Without it, ALLOW_UNAUTHENTICATED_ADMIN=true grants admin only to a
#        request that doesn't look like a browser; a real tab hitting /admin
#        is redirected to a "Sign In" form (mcpgateway/middleware/rbac.py's
#        get_current_user checks for a token before it reaches that bypass).
#        That is why earlier versions of this lab kept ContextForge
#        `ui: false` and shipped only the `view` page. This lab no longer
#        sets that flag.
#      - The session proxy cannot add a header, so workspace/admin_proxy.py
#        (the `admin` service) is a tiny stdlib reverse proxy that sets
#        X-Authenticated-User on every request, after discarding whatever
#        the client sent. It is the same file as in
#        labs/see-how-tools-reach-an-agent, port 8964.
#      - The admin pages are gated by a role, not just by is_admin, and the
#        platform_admin role is only assigned to the admin user at boot when
#        EMAIL_AUTH_ENABLED=true. So email auth is on, with two fixed
#        lab-only passwords (the default "changeme" fails its own strength
#        check). Nobody ever types them: there is no login page in reach
#        (the proxy turns /admin/login and the Logout button into a redirect
#        to the dashboard).
#      - MCPGATEWAY_UI_ENABLED and MCPGATEWAY_ADMIN_API_ENABLED (both default
#        false) must be true, or /admin is a 404.
#      - APP_ROOT_PATH is set to the admin tab's own prefix. The session
#        proxy forwards the full path unchanged, and with APP_ROOT_PATH
#        ContextForge both accepts it and writes the prefix into every asset
#        URL, htmx URL and redirect itself. It also still answers unprefixed
#        paths, so the scripts and the healthcheck are unaffected. (An older
#        note here said ContextForge had no path-prefix support; that was
#        wrong, and SERVER_ROOT_PATH, which this manifest used to set, is not
#        a setting ContextForge reads at all.)
#
# No Postgres: ContextForge's own state (gateways, servers, tokens) is
# SQLite-backed and that's sufficient for this lab; kept under /tmp, not
# /workspace, purely so the learner's workspace stays free of a database
# file that isn't theirs to look at.
#
# Ports: the lab's own 8901-8903 (tool servers) and 8904 (view) plus the
# canonical contextforge 4744; the admin proxy is 8964, the same as in
# labs/see-how-tools-reach-an-agent. The grader's own copies run on 18744 and
# 18901-18903, clear of all of them.

slug: one-endpoint-for-every-tool
version: 1.0.0
title: "Put every tool server behind one endpoint"
type: build
family: agent
path: ai-platform
module: 2
order: 2
prerequisites: [see-how-tools-reach-an-agent]
tier: pro
estimated_minutes: 55
difficulty: core
summary: >-
  Three teams built three MCP tool servers with no platform involved, and
  billing's server exposes an on-call-only tool next to its public one.
  Reconcile ContextForge with platform/catalogue.yaml: one virtual server
  with exactly the public tools, and one client token scoped to it.
objectives:
  - "Federate independently-built MCP tool servers behind one gateway, as opposed to handing every caller a different address"
  - "Bundle exactly the tools a caller should reach into one virtual server, deliberately leaving a sensitive tool out"
  - "Mint a client token scoped to one virtual server, and show it is refused for anything outside that bundle"
timeout_minutes: 90
idle_minutes: 10

env:
  CONTEXTFORGE_URL: "http://127.0.0.1:4744"
  INVENTORY_URL: "http://127.0.0.1:8901/mcp"
  BILLING_URL: "http://127.0.0.1:8902/mcp"
  SEARCH_URL: "http://127.0.0.1:8903/mcp"

services:
  - name: inventory
    user: learner
    # The inventory team's own tool server -- see services/inventory_server.py.
    argv: ["python3", "-B", "/workspace/services/inventory_server.py"]
    cwd: /workspace
    env:
      INVENTORY_PORT: "8901"
    port: 8901
    healthcheck:
      type: tcp
      timeout_s: 20
    ui: false
    depends_on: []
  - name: billing
    user: learner
    # The billing team's own tool server -- see services/billing_server.py.
    # Exposes two tools; only one belongs in the public bundle.
    argv: ["python3", "-B", "/workspace/services/billing_server.py"]
    cwd: /workspace
    env:
      BILLING_PORT: "8902"
    port: 8902
    healthcheck:
      type: tcp
      timeout_s: 20
    ui: false
    depends_on: []
  - name: search
    user: learner
    # The search team's own tool server -- see services/search_server.py.
    argv: ["python3", "-B", "/workspace/services/search_server.py"]
    cwd: /workspace
    env:
      SEARCH_PORT: "8903"
    port: 8903
    healthcheck:
      type: tcp
      timeout_s: 20
    ui: false
    depends_on: []
  - name: contextforge
    user: learner
    # ui: false, on purpose: this port is the raw gateway, which trusts the
    # X-Authenticated-User header from whoever sends it. The learner reaches
    # its admin pages only through the `admin` service below, which sets
    # that header itself. platform/setup.py and the other scripts here send
    # the same header for every management-API call (see the header comment).
    argv: ["mcpgateway", "--host", "0.0.0.0", "--port", "4744"]
    cwd: /workspace
    env:
      # No login, ever (docs/lab-authoring.md's no-login rule). Trusted-proxy
      # authentication: the admin identity comes from the X-Authenticated-User
      # header (PROXY_USER_HEADER's default), and only the value
      # PLATFORM_ADMIN_EMAIL makes an admin. See the header comment.
      MCP_CLIENT_AUTH_ENABLED: "false"
      TRUST_PROXY_AUTH: "true"
      TRUST_PROXY_AUTH_DANGEROUSLY: "true"
      PLATFORM_ADMIN_EMAIL: "admin@example.com"
      # false, not true: a request with no header is then anonymous (403)
      # instead of being sent to a /admin/login form.
      AUTH_REQUIRED: "false"
      # The admin pages, and the admin API routes they call.
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # Needed so the platform_admin role is assigned to PLATFORM_ADMIN_EMAIL
      # at boot (the admin routes check that role). The two passwords below
      # only have to pass ContextForge's strength check; no login page is
      # reachable, so nobody types them. Fixed lab-only values.
      EMAIL_AUTH_ENABLED: "true"
      # The admin tab's own prefix: the session proxy forwards the full path
      # (/sessions/<id>/services/admin/...) unchanged, and with this set
      # ContextForge accepts that path and puts the prefix into every URL it
      # writes. Must match the `admin` service's name below.
      APP_ROOT_PATH: "/sessions/{{session.id}}/services/admin"
      # Every tool server in this lab is loopback, inside this same
      # container -- SSRF protection blocks that by default.
      SSRF_ALLOW_LOCALHOST: "true"
      # Without this, a bad request body comes back as the opaque "An
      # error occurred, please try again." -- true in production, but this
      # is a training environment and the real field-level message (e.g.
      # which field failed, and why) is exactly what makes API mistakes
      # fixable here.
      EXPOSE_ERROR_DETAILS: "true"
      DATABASE_URL: "sqlite:////tmp/contextforge/mcp.db"
      # Fixed, lab-only secrets (this gateway holds no real credentials) --
      # each satisfies ContextForge's own minimum-length/entropy checks, so
      # boot doesn't refuse to start. Never reused outside this lab.
      JWT_SECRET_KEY: "GXBv511pOnefep_S43RPIOyPVRl1NphIidIc9C3QceM"
      AUTH_ENCRYPTION_SECRET: "gK1CFrDLkafMjPk6HsmUhC0BJLGqDaW-jG0EL2AivAs"
      BASIC_AUTH_PASSWORD: "J40SRm3gOwrvRU_Ka8102aGT"
      PLATFORM_ADMIN_PASSWORD: "WECQplHNcv0pe937pcr3IXxS"
      DEFAULT_USER_PASSWORD: "Wz-Hl4DmrOJ083ga4KvcQhd4"
    port: 4744
    healthcheck:
      type: http
      path: /health
      # First boot runs ContextForge's own migrations against a fresh
      # SQLite file -- proven live at ~10-11s cold; 60s leaves headroom
      # for a slower container without hiding a real failure.
      timeout_s: 60
    ui: false
    depends_on: [inventory, billing, search]
  - name: admin
    user: learner
    label: ContextForge
    about: ContextForge's own admin pages, already signed in. Watch your gateways, virtual server and tokens appear here as setup.py creates them.
    # A tiny stdlib reverse proxy (workspace/admin_proxy.py) in front of
    # ContextForge on 127.0.0.1:4744. It sets X-Authenticated-User to
    # PLATFORM_ADMIN_EMAIL on every request (replacing any value the client
    # sent), which is what ContextForge's trusted-proxy mode takes as the
    # admin -- so the real admin pages open with no login form. See the
    # header comment. ADMIN_PREFIX must equal this service's own prefix and
    # the contextforge service's APP_ROOT_PATH.
    argv: ["python3", "-B", "/workspace/admin_proxy.py"]
    cwd: /workspace
    env:
      ADMIN_PORT: "8964"
      ADMIN_PREFIX: "{{service.prefix}}"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      ADMIN_USER: "admin@example.com"
    port: 8964
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 30
    ui: true
    depends_on: [contextforge]
  - name: view
    user: learner
    label: Live view
    about: A read-only page that updates as you work. It shows what your lab is doing right now.
    # A small read-only stdlib page, services/view.py, next to the admin
    # tab: the same facts in one compact page. It never accepts a write and
    # never returns a usable token.
    argv: ["python3", "-B", "/workspace/services/view.py"]
    cwd: /workspace
    env:
      VIEW_PORT: "8904"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
    port: 8904
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 20
    ui: true
    depends_on: [contextforge]

pressure: []

checks:
  - name: bundle-reaches-exactly-its-tools
    script: bundle-reaches-exactly-its-tools.sh
    timeout_s: 180
    weight: 2
    parallel: false
  - name: excluded-tool-stays-out
    script: excluded-tool-stays-out.sh
    timeout_s: 180
    weight: 2
    parallel: false
  # The anti-cheat: stops the first two being satisfied by handing out a
  # token that can do more than the lab asks for (e.g. one that can also
  # reach the gateway's admin-plane, or a second virtual server).
  - name: client-token-cannot-escalate
    script: client-token-cannot-escalate.sh
    timeout_s: 180
    weight: 1
    parallel: false

hints:
  # ~15% of timeout_minutes -- outcome-level only, no specific calls named.
  - after_minutes: 14
    text: >-
      Three separate things have to happen, in this order: every tool
      server named in platform/catalogue.yaml gets registered with the
      gateway; then one virtual server gets created bundling exactly the
      tools catalogue.yaml's public_bundle names, and no others; then one
      client token gets minted, scoped to that one virtual server. None of
      this is undocumented -- it's ordinary management-API calls, the same
      ones the gateway's own tooling would use. Try each step by hand with
      curl before you script it, and read back what you got before moving
      to the next step.
  # ~30% of timeout_minutes -- still outcome-level.
  - after_minutes: 27
    text: >-
      A tool server you just registered doesn't necessarily show its tools
      in the very same response that registered it -- confirm separately
      that each one actually federated before you try to reference its
      tools by id. And a federated tool's name isn't the same string the
      tool server itself uses -- it's derived from both the gateway's name
      and the tool's own name, so read back what the gateway actually
      calls each tool rather than guessing.
  # ~45% of timeout_minutes -- may name the specific traps.
  - after_minutes: 40
    text: >-
      Two traps in the request bodies themselves: creating a virtual
      server needs the tool IDs under a field called `associated_tools`,
      not the `associatedTools` name the *read-back* response uses for the
      same data -- sending the response shape back verbatim creates a
      virtual server with an empty bundle, no error. And minting a scoped
      token needs `server_id` and `permissions` nested under a `scope`
      object, plus an `expires_in_days` (token expiration is required by
      this gateway's policy) -- not top-level `server_id`/`resource_scopes`
      fields, which is what that endpoint's own response happens to look
      like too.

egress:
  allow: []
