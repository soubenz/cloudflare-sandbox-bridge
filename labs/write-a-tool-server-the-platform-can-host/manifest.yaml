# Path 3, Module 2, lab 4 (build, agent family). Design proven live
# against a scratchpad reference implementation (own venv,
# mcp-contextforge-gateway==1.0.10, Python 3.12, mcp==1.30.0 -- see this
# lab's own report for the transcript) and against the real
# checks/_harness.py grader below.
#
# ContextForge's own admin UI is a `ui: true` tab here (service `admin`), with
# no login form, by trusted-proxy authentication -- the same approach, and
# the same reasons, as labs/see-how-tools-reach-an-agent (read its manifest
# header for the live proof; nothing below re-derives it):
#
#  - AUTH_REQUIRED=false + ALLOW_UNAUTHENTICATED_ADMIN=true only grants admin
#    to a request that does not look like a browser, so a real tab hitting
#    /admin was redirected to a "Sign In" form. That is why earlier versions
#    of this lab kept ContextForge `ui: false` and shipped only `view`. This
#    lab no longer sets that flag.
#  - MCP_CLIENT_AUTH_ENABLED=false, TRUST_PROXY_AUTH=true and
#    TRUST_PROXY_AUTH_DANGEROUSLY=true make a request carrying
#    X-Authenticated-User: <PLATFORM_ADMIN_EMAIL> an admin request, browser or
#    not. The session proxy cannot add a header, so workspace/admin_proxy.py
#    (the `admin` service) is a tiny stdlib reverse proxy that sets it on
#    every request, after discarding whatever the client sent. Every script
#    that talks to ContextForge directly -- register.py, view.py and the
#    grader's checks/_harness.py -- sends the same header: with trusted proxy
#    mode on, a request with no header is anonymous and gets 403.
#  - The admin pages are gated by a role, so EMAIL_AUTH_ENABLED=true (the
#    platform_admin role is assigned at boot only then), with the two fixed
#    lab-only passwords below. Nobody types them: the proxy turns
#    /admin/login and the Logout button into a redirect to the dashboard.
#  - APP_ROOT_PATH is the admin tab's own prefix, so ContextForge writes it
#    into every URL itself and the proxy rewrites nothing in a page. It still
#    answers unprefixed paths, so register.py, the grader and the
#    healthcheck are unaffected.
#
# The learner's own tool server is untouched by this: still a plain MCP
# endpoint. register.py is still the one POST /gateways call -- it carries the
# header, and first removes an earlier registration of the same name (a
# gateway name is unique, so a second run used to answer 409). What it
# registers shows up under Gateways and Tools in the ContextForge tab as well
# as in `view`. The tab is for looking: a write made from the page itself (a
# browser POST, e.g. the Delete button) is refused by ContextForge's admin
# CSRF origin check (403 "CSRF origin validation failed", seen live: the proxy
# talks to ContextForge under its own Host, the browser sends its own
# Origin). Reads, and every scripted call, are unaffected.
# The grader (checks/_harness.py) boots its own throwaway ContextForge with
# this same trusted-proxy env, so what it grades is what the learner runs.
#
# Settled: what "a health check" means here (catalogue: "Typed inputs,
# real errors, pagination, and a health check").
#
# ContextForge has no separate HTTP health-check route for a registered
# tool server, and this lab does not add one. Reachability is the MCP
# handshake itself: ContextForge's own gateway_service.py runs its
# periodic health check on a STREAMABLEHTTP gateway by opening a fresh
# MCP session and calling `session.initialize()` -- its own comment
# reads "Health checks are system operations with no downstream MCP
# session... the probe is cheap and verifies that an initialize
# round-trip works." That is the same handshake POST /gateways performs
# synchronously at registration time (initialize, then tools/list),
# which is how it fills in `reachable` and `toolCount` on the spot --
# confirmed live: registering this lab's own reference tool server
# returned `"reachable": true, "toolCount": 2` immediately, before any
# periodic recheck could have run.
#
# Concretely: a GET on the tool server's own /mcp path (what a bespoke
# HTTP /health route would look like) returns 406 Not Acceptable -- an
# MCP streamable-http server only understands the JSON-RPC handshake, not
# a bare GET -- confirmed live against workspace/tool_server.py. So the
# platform-level healthcheck below is `type: tcp` (did the process open
# the port at all), not `type: http`; the MCP-level reachability check
# that actually matters is ContextForge's own initialize handshake, which
# this lab's grader exercises by registering the tool server the same
# way register.py does and reading back `reachable`/`toolCount`, not by
# adding a route that doesn't exist in the spec.
#
# Other settled facts, each confirmed live against this lab's own
# reference implementation (not the general ContextForge investigation,
# which only established the mechanism existed, not this lab's specific
# contract):
#
#  1. Typed inputs: a plain Python type hint on a `@mcp.tool()` function
#     (`order_id: int`, `cursor: str | None`, `page_size: int`) becomes
#     the tool's real inputSchema, word for word -- confirmed by reading
#     it back from ContextForge's own GET /tools after registration.
#  2. Real errors, two distinct mechanisms, both live: a bare Python
#     exception in a tool function is already caught by the `mcp` SDK's
#     own call_tool handler and comes back as CallToolResult(isError=True),
#     but with the *raw* exception string as the message (confirmed:
#     get_order on an id past the end of the dataset returns
#     'list index out of range', not a domain message). A value that is
#     type-valid but nonsensical (page_size=-3, an out-of-range cursor)
#     raises nothing on its own -- Python's list slicing tolerates a
#     negative or huge index silently -- so the untouched skeleton
#     returns a *wrong* page with isError:false; the fix is an explicit
#     check that raises mcp.server.fastmcp.exceptions.ToolError with a
#     clean message. The grader tells these apart: isError:true alone
#     is not enough to pass, the message must not be a leaked Python
#     exception either.
#  3. Pagination: mcp.types.PaginatedResult's own `cursor` request field
#     / `nextCursor` response field is the SDK's real cursor convention
#     (used for tools/list, resources/list, etc contains itself); this
#     lab's list_orders tool reuses that same naming for a tool-level
#     result rather than the (different) list-endpoint pagination it was
#     designed for, because MCP has no separate spec concept for
#     paginating a tool's own return value. Confirmed live: walking
#     list_orders with its own nextCursor across a 55-row dataset visits
#     all 55 ids exactly once in 6 pages (10,10,10,10,10,5), then reports
#     no further cursor.
#  4. Registration: ContextForge does not poll for or auto-discover a
#     tool server on its own -- POST /gateways is the one call that
#     starts the whole thing (initialize, tools/list, storing the
#     schemas), so this lab ships that call as a workspace/register.py
#     step the learner runs themselves, matching ContextForge's real,
#     push-based registration flow rather than inventing an auto-register
#     mechanism it doesn't have.
#  5. Two env quirks not documented anywhere obvious, both hit live
#     standing this exact manifest up: MCPGATEWAY_ADMIN_API_ENABLED must
#     be set (default false) alongside MCPGATEWAY_UI_ENABLED for POST
#     /gateways etc. to exist at all; and SSRF_ALLOW_LOCALHOST must be
#     true or ContextForge's own SSRF guard refuses to register a gateway
#     whose URL is 127.0.0.1 -- which every tool server in this sandbox
#     necessarily is.
#
# The five *_PASSWORD/*_SECRET values below are fixed, disposable,
# lab-only strings (generated once with `python -m
# mcpgateway.scripts.init_secrets --stdout`) -- ContextForge refuses to
# boot with its own default/placeholder secrets, but nothing in this
# sandbox needs them to be unguessable.
slug: write-a-tool-server-the-platform-can-host
version: 1.0.0
title: "Write a tool server the platform can host"
type: build
learner_restart: true
family: agent
path: ai-platform
module: 2
order: 4
tier: pro
estimated_minutes: 50
summary: >-
  ContextForge is up and empty. Fix and complete your own MCP tool
  server -- typed inputs, real errors instead of silent wrong answers,
  and correct cursor-based pagination over a 55-row dataset -- then
  register it so ContextForge discovers it and calls it for real.
objectives:
  - "Expose tools whose input schema comes from real Python type hints, not stringly-typed parameters"
  - "Return a real MCP error (isError: true, a clean message) for input that is bad, not a crash or a silently wrong answer"
  - "Implement cursor-based pagination that walks an entire dataset with no duplicates and no gaps"
difficulty: core
timeout_minutes: 90
idle_minutes: 10

env:
  CONTEXTFORGE_URL: "http://127.0.0.1:4744"
  TOOL_SERVER_PORT: "8990"

services:
  - name: contextforge
    argv: ["mcpgateway", "--host", "0.0.0.0", "--port", "4744"]
    cwd: /workspace
    env:
      # No login, ever (docs/lab-authoring.md's no-login rule). Trusted-proxy
      # authentication: the admin identity comes from the X-Authenticated-User
      # header (PROXY_USER_HEADER's default), and only the value
      # PLATFORM_ADMIN_EMAIL makes an admin. See the note above.
      MCP_CLIENT_AUTH_ENABLED: "false"
      TRUST_PROXY_AUTH: "true"
      TRUST_PROXY_AUTH_DANGEROUSLY: "true"
      PLATFORM_ADMIN_EMAIL: "admin@example.com"
      # false, not true: a request with no header is then anonymous (403)
      # instead of being sent to a /admin/login form.
      AUTH_REQUIRED: "false"
      MCPGATEWAY_UI_ENABLED: "true"
      # Default false -- without this, POST /gateways (and every other
      # admin API route) 404s even though the UI itself loads fine.
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # Needed so the platform_admin role is assigned to PLATFORM_ADMIN_EMAIL
      # at boot (the admin routes check that role). The two passwords below
      # only have to pass ContextForge's strength check; no login page is
      # reachable, so nobody types them.
      EMAIL_AUTH_ENABLED: "true"
      # The admin tab's own prefix: the session proxy forwards the full path
      # (/sessions/<id>/services/admin/...) unchanged, and with this set
      # ContextForge accepts that path and puts the prefix into every URL it
      # writes. Must match the `admin` service's name below.
      APP_ROOT_PATH: "/sessions/{{session.id}}/services/admin"
      # Without this, POST /gateways 422s on any 127.0.0.1/localhost URL
      # -- ContextForge's own SSRF guard, and every tool server here is
      # local by construction.
      SSRF_ALLOW_LOCALHOST: "true"
      # Off so the admin pages' own polling, register.py's polling and the
      # grader can never trip ContextForge's real rate limiter and its
      # 15-minute account lockout.
      RATE_LIMITING_ENABLED: "false"
      DATABASE_URL: "sqlite:////tmp/contextforge-lab/mcp.db"
      JWT_SECRET_KEY: "_DnBwb7LmRkX3QZaMLEGngj9VTVjt67ASCS2d3GBMRE"
      AUTH_ENCRYPTION_SECRET: "eHBjKPY21ol8QWstof0PHefa7-PVTZE2fr_ICOvTVhw"
      PLATFORM_ADMIN_PASSWORD: "KF8V_vKf96CMLMwupsGTPpK4"
      BASIC_AUTH_PASSWORD: "n9WTuvvaijBD38-X3snnEdtl"
      DEFAULT_USER_PASSWORD: "PZy7Rp7NYkfdJOVnMc5s_68G"
    port: 4744
    healthcheck:
      type: http
      path: /health
      timeout_s: 60
    # ui: false, on purpose: this port is the raw gateway, which trusts the
    # X-Authenticated-User header from whoever sends it. The learner reaches
    # its admin pages only through the `admin` service below, which sets that
    # header itself.
    ui: false
    depends_on: []
  # The learner's own tool server. `ui: false` -- an MCP streamable-http
  # endpoint only answers JSON-RPC POSTs (a bare GET is 406, confirmed
  # live), so there is no browsable page to proxy here; this is a plain,
  # unproxied services[] entry specifically so the platform's own
  # process supervisor runs it directly (not backgrounded by a wrapper
  # script) and the learner can restart it from the Services panel after
  # every edit, or after a bad call takes it down while they're testing.
  - name: tool-server
    argv: ["python3", "-B", "/workspace/tool_server.py"]
    cwd: /workspace
    env:
      TOOL_SERVER_PORT: "8990"
    port: 8990
    healthcheck:
      # type: http would need a real HTTP health route; this server has
      # none (see the header comment) -- a GET on its one path, /mcp,
      # returns 406 even when the server is completely healthy. `tcp`
      # (the schema default) only confirms the port is open, which is
      # the right-shaped check for a JSON-RPC-only endpoint.
      type: tcp
      timeout_s: 30
    ui: false
    depends_on: []
  - name: admin
    label: ContextForge
    about: ContextForge's own admin pages, already signed in. After you run register.py, look for your tool server under Gateways and Tools here.
    # A tiny stdlib reverse proxy (workspace/admin_proxy.py) in front of
    # ContextForge on 127.0.0.1:4744. It sets X-Authenticated-User to
    # PLATFORM_ADMIN_EMAIL on every request (replacing any value the client
    # sent), which is what ContextForge's trusted-proxy mode takes as the
    # admin -- so the real admin pages open with no login form. See the note
    # at the top. ADMIN_PREFIX must equal this service's own prefix and the
    # contextforge service's APP_ROOT_PATH.
    argv: ["python3", "-B", "/workspace/admin_proxy.py"]
    cwd: /workspace
    env:
      ADMIN_PORT: "8964"
      ADMIN_PREFIX: "{{service.prefix}}"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      ADMIN_USER: "admin@example.com"
    port: 8964
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 30
    ui: true
    depends_on: [contextforge]
  # A small read-only stdlib page next to the admin tab, workspace/view.py:
  # a compact version of the same facts that reloads itself every few
  # seconds. It never accepts a write and calls ContextForge's REST API the
  # same way register.py does, with the same trusted-proxy header.
  - name: view
    label: Live view
    about: A read-only page that updates as you work. It shows what your lab is doing right now.
    argv: ["python3", "-B", "/workspace/view.py"]
    cwd: /workspace
    env:
      VIEW_PORT: "8992"
      VIEW_PREFIX: "{{service.prefix}}"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
    port: 8992
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 20
    ui: true
    depends_on: [contextforge]

pressure: []

checks:
  # Shared setup (own throwaway ContextForge instance + a fresh subprocess
  # of the learner's own tool_server.py, on their own ports) lives in
  # _harness.py; each check reads the same recorded facts. See its module
  # docstring for the full design and this lab's own report for the
  # proof runs (untouched skeleton: fails errors-are-clean-not-leaky and
  # pagination-is-correct with clear messages, passes the other two;
  # reference solution: passes all four, 3 consecutive runs; a variant
  # with a clean page_size/order_id check but a bare, uncaught
  # `int(cursor)` fails errors-are-clean-not-leaky specifically).
  - name: typed-inputs-are-enforced
    script: typed-inputs-are-enforced.sh
    timeout_s: 120
    weight: 1
    parallel: false
  - name: errors-are-clean-not-leaky
    script: errors-are-clean-not-leaky.sh
    timeout_s: 120
    weight: 2
    parallel: false
  - name: pagination-is-correct
    script: pagination-is-correct.sh
    timeout_s: 120
    weight: 2
    parallel: false
  - name: registers-cleanly
    script: registers-cleanly.sh
    timeout_s: 120
    weight: 1
    parallel: false

hints:
  # ~15% of timeout_minutes.
  - after_minutes: 13
    text: >-
      get_order's order_id is a real field on each order dict, not a
      position in the list -- something that indexes ORDERS directly
      with it is answering "what's the Nth order" instead of "what's the
      order with this id", and those only agree by accident.
  # ~30% of timeout_minutes.
  - after_minutes: 27
    text: >-
      list_orders's cursor/nextCursor pair is meant to be round-tripped:
      whatever nextCursor your own call returns becomes the cursor
      argument the caller passes back on the next call, and that's how
      it knows where to resume. If list_orders returns the same page
      and the same (or no) nextCursor regardless of what cursor came in,
      nothing before it is actually being read to decide where to start
      or when to stop.
  # ~45% of timeout_minutes.
  - after_minutes: 40
    text: >-
      A tool function that raises any exception already comes back
      isError:true -- the mcp SDK's own call_tool handler catches it.
      That's not the same as a clean error: the message a caller sees
      will be the raw Python exception, not something you wrote. A value
      that is type-valid but doesn't make sense (page_size <= 0, a
      cursor past the end of the dataset) won't raise anything on its
      own either -- Python's list slicing just returns something odd,
      silently. Both need an explicit check with your own message, raised
      as `raise mcp.server.fastmcp.exceptions.ToolError("...")` -- that's
      what turns "something went wrong somewhere" into a real, readable
      MCP error.

egress:
  allow: []
