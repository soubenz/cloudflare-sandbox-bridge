title: The front door for every model call
panels:
  # Hook: a customer left waiting, in their own words.
  - scene: desk
    cast: [maren]
    bg: sand
    caption: Last Tuesday.
    voiceover: Last Tuesday, a customer asked our support assistant a simple question. Then they waited. By the time the reply arrived, they'd typed hello three times, and the third one was in capitals.
    bubbles:
      - { who: maren, text: "Honestly, I'd have shouted too." }
    lines: ["customer: hello?", "customer: hello??", "customer: HELLO???", "assistant: typing..."]
  # The idea: what an AI gateway is.
  - scene: portrait
    cast: [tomasz]
    bg: ice
    prop: key
    sfx: ONE DOOR!
    caption: The AI gateway.
    voiceover: First, how our apps reach a model. They never call the provider, the company that runs the model, themselves. Every call goes through one front door that we run. We call it the AI gateway.
    bubbles:
      - { who: tomasz, text: "Like a hotel front desk. You ask the desk, and the desk knows who to call." }
  # Why we need one: Larkfield's own history.
  - scene: message
    cast: [maren]
    bg: rose
    prop: key
    sfx: OOPS!
    caption: Before the gateway.
    voiceover: We didn't always have one. Each team used to keep its own key for its provider. One of those keys ended up in a chat screenshot, and the screenshot got eleven thumbs up.
    bubbles:
      - { who: maren, text: "Eleven people liked it. Nobody read it." }
  - scene: desk
    cast: [tomasz]
    bg: navy
    sfx: DOWN!
    caption: Saturday, 3 a.m.
    voiceover: Then Support's provider went down in the middle of the night. Its name was written into their code, so moving to another provider meant Tomasz editing that code at three in the morning.
    bubbles:
      - { who: tomasz, text: "I've done good work at 3 a.m. That wasn't it." }
    lines: ["support assistant: down", "switch provider? edit the code", "redeploy at 03:40"]
  - scene: duo
    cast: [tomasz, maren]
    bg: mint
    voiceover: Now the keys live in the gateway and nowhere else. When a provider fails, the gateway sends the call to another one and no app has to change. It also writes down every call that goes through it.
    bubbles:
      - { who: tomasz, text: "So Jonas can finally see which team spent what." }
      - { who: maren, text: "He's sending far fewer shrug emojis." }
  # Behind the door: the parts one question touches.
  - scene: screen
    caption: Behind the door.
    voiceover: Back to our customer. Their question went in through the gateway and touched three more parts. The model wrote the reply. The vector store found our help articles. The cache checked for a recent answer.
    lines:
      - "gateway       the front door"
      - "model         writes the reply"
      - "vector store  finds our help articles"
      - "cache         remembers recent answers"
  # The problem: every log says fine.
  - scene: desk
    cast: [tomasz]
    bg: rose
    voiceover: Each part keeps its own log. Tomasz read all four for an hour. Every line said the request went fine, and not one of them said how long the customer had been sitting there.
    bubbles:
      - { who: tomasz, text: "Everyone says ok. Nobody says slow." }
    lines: ["gateway   ok", "model     ok", "vector    ok", "cache     ok"]
  # The tool: a trace, explained with parcel tracking.
  - scene: screen
    caption: A trace.
    voiceover: So the gateway also keeps a trace of each request. It's like a parcel tracking page, every stop on one page with when it arrived and how long it stayed. In a trace, each stop is called a span.
    lines:
      - "parcel 4471"
      - "collected          08:02"
      - "sorting hub        09:40 to 11:15"
      - "out for delivery   13:20"
      - "delivered          14:03"
  # The lab: one panel.
  - scene: you
    bg: cobalt
    caption: Your turn.
    voiceover: That customer's request has a trace waiting for you in Jaeger, our trace viewer. Find the slowest step, and add up the tokens, the bits of text the model charges for. Then find what the cache lookup sits under.
    lines: ["open the jaeger tab", "slowest step: ?", "model tokens: ?", "cache.get sits under: ?"]
