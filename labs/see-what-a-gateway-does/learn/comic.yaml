title: Four teams, four keys
pages:
  - title: Life without a gateway
    panels:
      - scene: message
        cast: [maren]
        bg: rose
        prop: key
        sfx: OOPS!
        caption: Four teams, four providers, four keys.
        bubbles:
          - { who: maren, text: "Welcome to the museum. Key two is in a chat screenshot. Thumbs up, nobody saw the key." }
      - scene: portrait
        cast: [priya]
        bg: navy
        prop: laptop
        sfx: DOWN!
        bubbles:
          - { who: priya, text: "Three in the morning, the provider is down. Search's assistant works. Can't we switch?" }
      - scene: duo
        cast: [tomasz, you]
        bg: lilac
        bubbles:
          - { who: tomasz, text: "They renamed a model. Three apps had the old name in their code." }
          - { who: you, text: "Before breakfast?" }
      - scene: message
        cast: [jonas]
        bg: mint
        prop: envelope
        sfx: INVOICE!
        bubbles:
          - { who: jonas, text: "One bill a month. Which team spent it? Which provider answered? A shrug." }
      - scene: screen
        caption: One loop, one weekend.
        lines: ["$ retry forever", "error: try again", "budget left: 0"]
  - title: One front door
    panels:
      - scene: portrait
        cast: [tomasz]
        bg: ice
        prop: key
        sfx: ONE DOOR!
        bubbles:
          - { who: tomasz, text: "My prototype. One front door. It holds the keys and logs every call." }
      - scene: screen
        lines: ["$ ask: support", "ok key accepted", "ok provider chosen", "ok cost logged"]
      - scene: duo
        cast: [tomasz, maren]
        bg: sand
        bubbles:
          - { who: tomasz, text: "It is meant to switch providers if one fails. Meant to." }
          - { who: maren, text: "So find out what it really does." }
      - scene: you
        bg: navy
        caption: Your turn.
        lines: ["$ send_calls.py support \"hello gateway\"", "ready."]
