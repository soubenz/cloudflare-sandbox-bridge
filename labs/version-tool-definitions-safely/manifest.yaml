# Path 3, Module 2, lab 5 -- REDESIGNED per the ContextForge feasibility
# investigation ($SCRATCH/contextforge-inv/FINDINGS.md): ContextForge has
# no real canary/percentage-rollout/history mechanism, only a bare edit
# counter, enabled/deprecated flags, and whole-config export/import. This
# lab is about the learner building their OWN staged-rollout and rollback
# discipline on top of those real primitives -- graded on whether that
# discipline actually works, not on a gateway feature that doesn't exist.
#
# Built in two passes: Part 1 (scaffolding + feasibility) proved the
# design live and shipped two of five checks; Part 2 (this pass) added
# solution/, the remaining three checks, hints, and the "Checking your
# work" table in brief.md.
#
# Everything below was proven live against a real
# mcp-contextforge-gateway==1.0.10, in a throwaway python3.12 venv, in this
# session's own scratchpad (never against the real lab image -- that gets
# python3.12 added later, same order as Module 1's Postgres template).
# Four things turned out to need a real design change from the original
# ask, found by actually exercising the running gateway rather than
# trusting its docs or the earlier investigation's summary of it:
#
#  1. SSRF protection blocks a gateway URL that points at 127.0.0.1/
#     localhost unless SSRF_ALLOW_LOCALHOST=true -- without it, registering
#     either tool server 422s with "Gateway URL contains localhost address
#     which is blocked by SSRF protection". Needed here because both tool
#     servers run in the same container as ContextForge itself.
#
#  2. The `deprecated` flag on a tool is NOT usable in 1.0.10, contrary to
#     the shared investigation's characterization of "enabled/deprecated
#     flags" as a pair of working primitives. Confirmed live: PUT
#     /v1/tools/{id} with {"deprecated": true} returns 200, bumps the
#     tool's edit counter, and its response still reports
#     `"deprecated": false` -- a GET immediately after confirms it never
#     persisted. Read from the installed source
#     (mcpgateway/services/tool_service.py, ToolService.update_tool): every
#     other ToolUpdate field is applied to the DB row in an
#     `if tool_update.X is not None:` block; `deprecated` has no such block
#     anywhere in that method. The admin UI's own edit-tool form
#     (mcpgateway/admin.py, admin_edit_tool) doesn't send the field either.
#     `enabled` (POST /v1/tools/{id}/state?activate=...) is the flag that
#     actually works -- confirmed live: disabling a tool makes it vanish
#     from that server's tools/list and refuses tools/call with a clear
#     "Tool '...' exists but is inactive" error. This lab's design leans on
#     `enabled`, not `deprecated`.
#
#  3. Whole-config re-import (POST /v1/import) is NOT a safe way to roll
#     back ONE virtual server's tool association while that server still
#     exists -- confirmed live, twice, against the real bug behavior:
#       a. conflict_strategy="update" (the default) against an existing
#          server: the response reports the server as a warning --
#          "Could not update server price-lookup: 'list' object has no
#          attribute 'name'" -- and the server's associated_tools is left
#          completely unchanged. Silently. No exception surfaces past a
#          warning string.
#       b. Deleting the server first, then re-importing, DOES restore the
#          correct tool association -- but the server comes back under a
#          brand-new id, which breaks the one thing a rollback must not
#          break: the stable address (`/servers/{id}/mcp`) every caller
#          already depends on.
#     A direct `PUT /v1/servers/{id}` with `associated_tools` (the same
#     call the cutover itself uses) is what actually works, live, in
#     well under a second, with the id untouched -- confirmed by timing it.
#     Export is still real and still worth taking -- as the timestamped
#     record of what was live, and (for a whole lost instance) as real
#     disaster recovery -- but it is not what applies a rollback here.
#     `workspace/rollout/rollout.py` points the learner at proving this
#     for themselves rather than stating it (no stated path), but the
#     graded checks (Part 2) will not reward a rollback whose mechanism is
#     "reimport over the live server" if it does not actually restore the
#     tool the caller needs -- or one that restores it under a new server
#     id.
#
#  4. GET /v1/export and POST /v1/import need an admin with a real role,
#     unlike the plain management routes: they are decorated
#     `@require_permission("admin.export"/"admin.import")`
#     (mcpgateway/main.py), and with ALLOW_UNAUTHENTICATED_ADMIN an
#     unauthenticated GET /v1/export was a 403 "Access denied" where the
#     identical request against /v1/gateways, /v1/servers, /v1/tools or
#     /v1/tokens succeeded -- which is why earlier versions of this lab had
#     the learner log in (POST /v1/auth/login with a manifest-level
#     PLATFORM_ADMIN_PASSWORD) just for the snapshot. Under trusted-proxy
#     mode (next paragraph) the platform_admin role is assigned to the
#     admin user at boot, and the same X-Authenticated-User header that opens
#     every other route opens export too, so there is nothing to log in to:
#     solution/rollout/rollout.py's `snapshot()` sends the header like every
#     other call. A bearer token minted by a login is NOT honoured on the
#     management routes in this mode, so the login path is gone, not
#     optional; PLATFORM_ADMIN_PASSWORD moved from the learner's env to the
#     contextforge service's own. One difference found live: a default
#     export also includes ContextForge's roots, and
#     _require_unrestricted_root_admin (mcpgateway/main.py) refuses a
#     header-authenticated admin for those (403 "Access denied" for the
#     whole call, role or not), so snapshot() asks for
#     `exclude_types=roots`, which this lab never uses; the skeleton's
#     docstring says so too.
#
# ContextForge is in trusted-proxy mode (MCP_CLIENT_AUTH_ENABLED=false,
# TRUST_PROXY_AUTH=true, TRUST_PROXY_AUTH_DANGEROUSLY=true): a request
# carrying X-Authenticated-User: <PLATFORM_ADMIN_EMAIL> is an admin request,
# browser or not (is_proxy_auth_trust_active in utils/verify_credentials.py).
# The whole /v1/* management API -- registering a gateway, creating and
# updating a virtual server, minting a token, exporting -- works with that
# one header and no bearer token; rollout/rollout.py, contextforge/seed.py,
# services/view.py and the grader's own admin-plane calls all send it
# (CONTEXTFORGE_ADMIN_USER overrides the value). A request with no header is
# anonymous and gets 403 there. The tool-calling surface is a different
# thing: caller.py and the grader's witness call /servers/{id}/mcp with a
# scoped Bearer token and NO header, and that is checked exactly as before
# (confirmed live: the token lists and calls the one tool; the header is
# never sent with it).
#
# ContextForge's own admin UI is a `ui: true` tab here (service `admin`),
# with no login form, by the same trusted-proxy header. Confirmed live with a
# real browser (Playwright + chromium) through a /sessions/<id>/services/
# admin/ path, no cookies:
#  - Without it, ALLOW_UNAUTHENTICATED_ADMIN=true grants admin only to a
#    request that doesn't look like a browser; a real tab hitting /admin is
#    redirected to a "Sign In" form (mcpgateway/middleware/rbac.py's
#    get_current_user checks for a token before it reaches that bypass).
#    That is why earlier versions of this lab kept ContextForge `ui: false`
#    and shipped only the `view` page. This lab no longer sets that flag.
#  - The session proxy cannot add a header, so workspace/admin_proxy.py (the
#    `admin` service) is a tiny stdlib reverse proxy that sets
#    X-Authenticated-User on every request, after discarding whatever the
#    client sent. It is the same file as in
#    labs/see-how-tools-reach-an-agent, port 8964.
#  - The admin pages are gated by a role, not just by is_admin, and the
#    platform_admin role is only assigned to the admin user at boot when
#    EMAIL_AUTH_ENABLED=true. So email auth is on, with two fixed lab-only
#    passwords (the default "changeme" fails its own strength check).
#    Nobody ever types them: there is no login page in reach (the proxy turns
#    /admin/login and the Logout button into a redirect to the dashboard).
#  - MCPGATEWAY_UI_ENABLED and MCPGATEWAY_ADMIN_API_ENABLED (both default
#    false) must be true, or /admin is a 404.
#  - APP_ROOT_PATH is set to the admin tab's own prefix. The session proxy
#    forwards the full path unchanged, and with APP_ROOT_PATH ContextForge
#    both accepts it and writes the prefix into every asset URL, htmx URL
#    and redirect itself, so the proxy rewrites nothing in a page body. It
#    also still answers unprefixed paths, so the scripts and the healthcheck
#    are unaffected. (An earlier note here said APP_ROOT_PATH only feeds
#    OpenAPI links and that the admin pages 404 under a prefix; that was
#    wrong once the setting is on, confirmed live.)
#
# Ports: the lab's own 65101/65102 (tool servers) and 65103 (view) plus the
# canonical contextforge 4744; the admin proxy is 8964, the same as in
# labs/see-how-tools-reach-an-agent. This lab's checks run against the live
# gateway, so they start nothing of their own.
#
# No Postgres: ContextForge's SQLite backend is real and sufficient for
# this lab (per the investigation; Redis is optional and unused here too).
slug: version-tool-definitions-safely
version: 1.0.0
title: "Version tool definitions and roll changes out safely"
type: build
family: agent
path: ai-platform
module: 2
order: 5
tier: pro
estimated_minutes: 60
summary: >-
  A caller depends on price-lookup's v1 shape. v2 is already built and
  running, but ContextForge doesn't know about it yet. Roll it out, and
  roll it back fast, without ever breaking the caller or leaving it a
  half-migrated answer.
objectives:
  - "Register a new tool version as its own, separately-addressable registration rather than editing the live one in place"
  - "Cut traffic over deliberately, in one step, rather than as a side effect of registering or testing a new version"
  - "Build a fast, same-address rollback out of a real config snapshot and your own bookkeeping, not a gateway feature that doesn't exist"
difficulty: core
timeout_minutes: 90
idle_minutes: 10

env:
  CONTEXTFORGE_URL: "http://127.0.0.1:4744"
  TOOL_SERVER_V1_URL: "http://127.0.0.1:65101/mcp"
  TOOL_SERVER_V2_URL: "http://127.0.0.1:65102/mcp"

services:
  - name: tool-server-v1
    user: learner
    argv: ["python3", "-B", "/workspace/services/tool_server.py", "v1"]
    cwd: /workspace
    port: 65101
    healthcheck:
      type: tcp
      timeout_s: 30
    ui: false
    depends_on: []
  - name: tool-server-v2
    user: learner
    argv: ["python3", "-B", "/workspace/services/tool_server.py", "v2"]
    cwd: /workspace
    port: 65102
    healthcheck:
      type: tcp
      timeout_s: 30
    ui: false
    depends_on: []
  - name: contextforge
    user: learner
    # mcpgateway-server is the real package's own console-script entry
    # point (mcp-contextforge-gateway==1.0.10); it reads HOST/PORT/etc from
    # its own Settings object, which is why they're plain env here rather
    # than argv flags. seed.py is launched backgrounded before it, the same
    # pattern hard-budget-per-team uses for seed_teams.py -- it does its
    # own readiness poll against /health, so nothing here has to wait on it,
    # and it's idempotent, so a restart of this service finds v1 already
    # registered and changes nothing.
    argv:
      [
        "sh", "-c",
        "python3 -B /workspace/contextforge/seed.py & exec mcpgateway-server",
      ]
    cwd: /workspace
    env:
      HOST: "0.0.0.0"
      PORT: "4744"
      DATABASE_URL: "sqlite:////workspace/contextforge/mcp.db"
      # Fixed literal values, not real secrets -- same pattern as this
      # repo's other labs' fixed LITELLM_MASTER_KEY. Must be non-placeholder
      # and pass a minimum entropy/length check (mcpgateway/config.py,
      # _enforce_secret_strength) -- confirmed live with values in this
      # shape; a short or `__REPLACE_ME__`-shaped value refuses to boot.
      JWT_SECRET_KEY: "M4iA8Pp-TGSbFIVwV8PNFsEsrmSfQTs2Ua6BD60kz0U"
      AUTH_ENCRYPTION_SECRET: "Yh4LCbuiYm_pvOflb8unP1ZNGwm32sJ2s6nMmLNUCv0"
      BASIC_AUTH_PASSWORD: "6QjTBJi8u5LGRqOoojlIylDE9yEJdu4F21ADjtv7V1o"
      # Needed so the platform_admin role is assigned to PLATFORM_ADMIN_EMAIL
      # at boot (the admin routes, export included, check that role). The
      # two passwords only have to pass ContextForge's strength check; no
      # login page is reachable and nothing logs in, so nobody types them.
      # Fixed lab-only values.
      EMAIL_AUTH_ENABLED: "true"
      PLATFORM_ADMIN_PASSWORD: "ph6RqKFKVHa5Dq8Mt2YJVYVh2cAMpH35O-wAiAC3QxA"
      DEFAULT_USER_PASSWORD: "btnQvQPFWHmyL4MEqYv0-VfgObdqliKNfi_2DtQ42q8"
      # No login, ever (docs/lab-authoring.md's no-login rule). Trusted-proxy
      # authentication: the admin identity comes from the X-Authenticated-User
      # header (PROXY_USER_HEADER's default), and only the value
      # PLATFORM_ADMIN_EMAIL makes an admin. See the header comment.
      MCP_CLIENT_AUTH_ENABLED: "false"
      TRUST_PROXY_AUTH: "true"
      TRUST_PROXY_AUTH_DANGEROUSLY: "true"
      PLATFORM_ADMIN_EMAIL: "admin@example.com"
      # false, not true: a request with no header is then anonymous (403)
      # instead of being sent to a /admin/login form.
      AUTH_REQUIRED: "false"
      # The admin pages, and the admin API routes they call.
      MCPGATEWAY_UI_ENABLED: "true"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # The admin tab's own prefix: the session proxy forwards the full path
      # (/sessions/<id>/services/admin/...) unchanged, and with this set
      # ContextForge accepts that path and puts the prefix into every URL it
      # writes. Must match the `admin` service's name below.
      APP_ROOT_PATH: "/sessions/{{session.id}}/services/admin"
      # Both tool servers are on 127.0.0.1 in this same container --
      # without this, registering either one 422s (see header comment #1).
      SSRF_ALLOW_LOCALHOST: "true"
      # Without this, a validation error (e.g. a malformed gateway
      # registration) comes back as a bare "An error occurred, please try
      # again." with no indication of which field or why -- confirmed live.
      # Real for this sandboxed lab; not something to carry into a
      # production deployment.
      EXPOSE_ERROR_DETAILS: "true"
      # Real ContextForge default (rate_limit_lockout_threshold=5,
      # rate_limit_lockout_duration_minutes=15): 5 rate-limit violations
      # trigger a 15-minute account lockout on every subsequent request.
      # Confirmed live: the graders' own dense polling (several concurrent
      # threads sampling GET /v1/servers/{id} with no delay, to catch a
      # narrow two-step-cutover race) tripped this for real, and every
      # check failed for the next 15 minutes with "Account locked". This is
      # a single-learner sandbox with one grader, not a multi-tenant
      # production gateway -- there is no one here for a rate limit to
      # protect against, so it's off, rather than trying to tune every
      # poller in this lab to stay under an undocumented threshold.
      RATE_LIMITING_ENABLED: "false"
    port: 4744
    healthcheck:
      type: http
      path: /health
      # Confirmed live: a fresh SQLite DB (first boot, all migrations
      # running) reported healthy in ~8s. 60s leaves real room for a slower
      # container without hiding an actual failure.
      timeout_s: 60
    # ui: false, on purpose: this port is the raw gateway, which trusts the
    # X-Authenticated-User header from whoever sends it. The learner reaches
    # its admin pages only through the `admin` service below, which sets
    # that header itself.
    ui: false
    depends_on: [tool-server-v1, tool-server-v2]
  - name: admin
    user: learner
    label: ContextForge
    about: ContextForge's own admin pages, already signed in. Watch price-tool-v2 get registered, and the price-lookup server's tool change at cutover and rollback.
    # A tiny stdlib reverse proxy (workspace/admin_proxy.py) in front of
    # ContextForge on 127.0.0.1:4744. It sets X-Authenticated-User to
    # PLATFORM_ADMIN_EMAIL on every request (replacing any value the client
    # sent), which is what ContextForge's trusted-proxy mode takes as the
    # admin -- so the real admin pages open with no login form. See the
    # header comment. ADMIN_PREFIX must equal this service's own prefix and
    # the contextforge service's APP_ROOT_PATH.
    argv: ["python3", "-B", "/workspace/admin_proxy.py"]
    cwd: /workspace
    env:
      ADMIN_PORT: "8964"
      ADMIN_PREFIX: "{{service.prefix}}"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      ADMIN_USER: "admin@example.com"
    port: 8964
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 30
    ui: true
    depends_on: [contextforge]
  - name: view
    user: learner
    label: Live view
    about: A read-only page that updates as you work. It shows what your lab is doing right now.
    # A small read-only stdlib page, services/view.py, next to the admin tab:
    # which gateways and tools exist, and which one price-lookup serves.
    argv: ["python3", "-B", "/workspace/services/view.py"]
    cwd: /workspace
    env:
      VIEW_PORT: "65103"
      CONTEXTFORGE_URL: "http://127.0.0.1:4744"
      # The session proxy forwards this service's full path unchanged
      # (docs/lab-authoring.md) -- view.py strips this itself.
      VIEW_PREFIX: "{{service.prefix}}"
    port: 65103
    healthcheck:
      type: http
      path: /healthz
      timeout_s: 20
    ui: true
    depends_on: [contextforge]

pressure: []

checks:
  # None of these read the learner's source. Four of the five share ONE
  # live run of the actual scenario (checks/_harness.py: register_v2(),
  # then snapshot()+cutover_to("v2")+rollback(), calling the learner's own
  # rollout.py directly and driving real traffic and real ContextForge
  # state changes throughout) -- whichever check runs first pays that cost
  # and the others just read its recorded results, same shared-run pattern
  # as labs/hard-budget-per-team and labs/one-endpoint-one-key. Sequential
  # on purpose. caller-still-works is the one exception: cheap, safe to run
  # standalone, and stays parallel.
  - name: v2-registered-independently
    script: v2-registered-independently.sh
    timeout_s: 240
    weight: 2
    parallel: false
  - name: no-downtime-during-registration
    script: no-downtime-during-registration.sh
    timeout_s: 240
    weight: 2
    parallel: false
  - name: rollback-is-fast-and-stable
    script: rollback-is-fast-and-stable.sh
    timeout_s: 240
    weight: 2
    parallel: false
  # The anti-cheat: stops the other checks being satisfied by a cutover
  # or rollback built as two separate calls (remove the old tool, then
  # add the new one) -- the two-step shape that can leave a caller with
  # no tool at all, or two, for a real (if narrow) window.
  - name: never-zero-or-two-tools-live
    script: never-zero-or-two-tools-live.sh
    timeout_s: 240
    weight: 1
    parallel: false
  - name: caller-still-works
    script: caller-still-works.sh
    timeout_s: 30
    weight: 1
    parallel: true

hints:
  # ~15% of timeout_minutes.
  - after_minutes: 14
    text: >-
      Three real, separate primitives are what you have: a gateway
      registration (one tool version, one URL, independent of any other
      registration), a tool's enabled/disabled state, and a virtual
      server's list of associated tools. Nothing about registering or
      testing v2 has to touch `price-lookup`'s own associated-tools list
      at all -- that list is the only thing an existing caller's answer
      actually depends on.
  # ~30% of timeout_minutes.
  - after_minutes: 27
    text: >-
      Think of cutover and rollback as the exact same kind of operation --
      "make this one tool the one `price-lookup` serves" -- just with a
      different target. Whichever way you write that operation, make it
      ONE call that replaces the whole associated-tools list, never two
      calls where one removes the old tool and a later one adds the new
      one. A caller can ask what `price-lookup` serves at any instant; a
      two-call version has a real, if narrow, moment where the honest
      answer is "nothing" or "both."
  # ~45% of timeout_minutes.
  - after_minutes: 41
    text: >-
      The concrete calls: `POST /v1/tools/{tool_id}/state?activate=true|false`
      toggles a tool on or off. `PUT /v1/servers/{server_id}` with an
      `associated_tools` list (tool IDs) is the single call that both
      cutover and rollback are built from -- it replaces the whole list in
      one request. If you're leaning on `POST /v1/import` to put a
      snapshot back, check afterward what actually changed on the server
      you re-imported over, not just what the import call returned.

egress:
  allow: []
