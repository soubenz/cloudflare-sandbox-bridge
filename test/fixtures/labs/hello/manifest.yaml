# Trivial lab used only to exercise the sandbox API end to end (spike,
# integration tests, and `opalix labs test`). Not a real Opalix lab.
slug: hello
version: 1.0.0
title: "Hello, sandbox"
type: build
summary: "A five-minute smoke test: open a shell, write one file, run the grader. Start here to see how a lab works before one has stakes."
difficulty: intro
objectives:
  - "Find your way around the workspace, terminal and editor"
  - "Read a lab's environment from inside the container"
  - "Run the grader and read what a failing check tells you"
family: agent
timeout_minutes: 60
idle_minutes: 10
env:
  GREETING: "hello from opalix"
services:
  # A bare `http.server` has no concept of a URL prefix, and the service
  # proxy (src/session/proxy.ts) deliberately forwards the incoming path
  # unchanged — real services (Grafana, LiteLLM) handle their own prefix
  # via config (GF_SERVER_ROOT_URL, SERVER_ROOT_PATH). This fixture has no
  # such config, so it always serves index.html regardless of path instead.
  - name: echo
    argv:
      [
        "python3", "-c",
        "import http.server,socketserver\nclass H(http.server.SimpleHTTPRequestHandler):\n def do_GET(self):\n  self.path='/index.html'\n  return super().do_GET()\nhttp.server.HTTPServer(('0.0.0.0',8000),H).serve_forever()",
      ]
    cwd: /workspace
    port: 8000
    healthcheck:
      type: tcp
      timeout_s: 15
    ui: true
    depends_on: []
pressure:
  - id: burst
    at_minutes: 1
    argv: ["/opt/lab/pressure/burst.sh"]
    title: "A burst arrives"
    message: "Something changed. Check the workspace."
checks:
  - name: greeting-file-exists
    script: greeting.sh
    timeout_s: 10
    weight: 1
hints:
  - after_minutes: 2
    text: "Write the value of $GREETING to /workspace/greeting.txt"
egress:
  allow: []
