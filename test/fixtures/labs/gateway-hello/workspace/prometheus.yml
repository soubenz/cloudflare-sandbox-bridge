# __PREFIX__ is replaced with this session's service path at service start
# (see manifest.yaml): Prometheus serves its whole HTTP surface, /metrics
# included, under that prefix, so a self-scrape has to ask for it there.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    metrics_path: __PREFIX__/metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
