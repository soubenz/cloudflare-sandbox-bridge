# Test fixture for Tier 3 (time behaviors). Not a real Opalix lab.
# idle_minutes is the schema minimum so the idle-timeout path is
# observable in a test run rather than in ten minutes. The pressure event
# fires at 0 so it cannot land in the same alarm tick as the idle timeout —
# when it did, idle ended the session and destroyed the container first,
# and the pressure exec then failed against a container that was gone.
slug: impatient
version: 1.0.0
title: "Impatient (idle-timeout fixture)"
type: build
family: agent
timeout_minutes: 60
idle_minutes: 1
env:
  GREETING: "hello from opalix"
services:
  - name: echo
    argv:
      [
        "python3", "-c",
        "import http.server,socketserver\nclass H(http.server.SimpleHTTPRequestHandler):\n def do_GET(self):\n  self.path='/index.html'\n  return super().do_GET()\nsocketserver.TCPServer(('0.0.0.0',8000),H).serve_forever()",
      ]
    cwd: /workspace
    port: 8000
    healthcheck:
      type: tcp
      timeout_s: 15
    ui: true
    depends_on: []
pressure:
  - id: burst
    at_minutes: 0
    argv: ["/opt/lab/pressure/burst.sh"]
    title: "A burst arrives"
    message: "Something changed. Check the workspace."
checks:
  - name: greeting-file-exists
    script: greeting.sh
    timeout_s: 10
    weight: 1
hints:
  - after_minutes: 1
    text: "Write the value of $GREETING to /workspace/greeting.txt"
egress:
  allow: []
